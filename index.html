<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>⚽ Fútbol Toques</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;

    background: #101010;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

}

h1 {

    margin: 10px 0 4px;

    font-size: 25px;

}

#estado {

    min-height: 22px;

    color: #ccc;

    font-size: 14px;

}

#contador {

    font-size: 60px;

    font-weight: bold;

    line-height: 1;

    margin: 5px 0 10px;

}


/* ==============================
   CÁMARA
============================== */

#zonaCamara {

    position: relative;

    width: 96vw;

    max-width: 900px;

    height: 75vh;

    margin: auto;

    overflow: hidden;

    background: #000;

    border-radius: 16px;

}

#video {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

}

#canvas {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

}


/* ==============================
   BALÓN
============================== */

#balon {

    position: absolute;

    width: 58px;
    height: 58px;

    margin-left: -29px;
    margin-top: -29px;

    display: none;

    z-index: 20;

    pointer-events: none;

    font-size: 48px;

    line-height: 58px;

    filter:
        drop-shadow(
            0 4px 4px
            rgba(0,0,0,.75)
        );

}


/* ==============================
   BOTONES
============================== */

.controles {

    width: 96%;

    max-width: 800px;

    margin: 10px auto;

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

}

button {

    border: none;

    border-radius: 11px;

    padding: 12px 15px;

    color: white;

    font-size: 15px;

    font-weight: bold;

}

#activar {
    background: #00a844;
}

#empezar {
    background: #1976d2;
}

#reiniciar {
    background: #d32f2f;
}

#cambiar {
    background: #7b1fa2;
}

#calibrar {
    background: #ef6c00;
}

button:disabled {
    opacity: .4;
}


/* ==============================
   ZOOM
============================== */

#zoomBox {

    width: 94%;

    max-width: 500px;

    margin: 10px auto;

    padding: 10px;

    border-radius: 12px;

    background: #222;

}

#zoom {

    width: 100%;

}


/* ==============================
   INFORMACIÓN
============================== */

#info {

    width: 94%;

    max-width: 700px;

    margin: 10px auto 25px;

    padding: 10px;

    background: #202020;

    border-radius: 13px;

}

.fila {

    display: flex;

    justify-content: space-between;

    padding: 5px;

    border-bottom: 1px solid #333;

}

.ok {
    color: #55ff77;
}

.no {
    color: #888;
}

</style>

</head>


<body>


<h1>⚽ Fútbol Toques</h1>

<div id="estado">
    Pulsa «Activar cámara»
</div>

<div id="contador">
    0
</div>


<div id="zonaCamara">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

    <div id="balon">
        ⚽
    </div>

</div>


<div class="controles">

    <button id="activar">
        📷 Activar cámara
    </button>

    <button id="empezar" disabled>
        ▶️ Empezar
    </button>

    <button id="reiniciar">
        🔄 Reiniciar
    </button>

    <button id="cambiar" disabled>
        🔁 Cámara
    </button>

    <button id="calibrar" disabled>
        🎯 Calibrar
    </button>

</div>


<div id="zoomBox">

    🔍 Zoom

    <br>

    <input
        id="zoom"
        type="range"
        min="0.5"
        max="3"
        step="0.1"
        value="0.5"
        disabled>

    <br>

    <span id="zoomTexto">
        0,5×
    </span>

</div>


<div id="info">

    <div class="fila">
        <span>🦵 Rodilla izquierda</span>
        <span id="rodillaI" class="no">—</span>
    </div>

    <div class="fila">
        <span>🦵 Rodilla derecha</span>
        <span id="rodillaD" class="no">—</span>
    </div>

    <div class="fila">
        <span>🦶 Pie izquierdo</span>
        <span id="pieI" class="no">—</span>
    </div>

    <div class="fila">
        <span>🦶 Pie derecho</span>
        <span id="pieD" class="no">—</span>
    </div>

    <div class="fila">
        <span>🫁 Pecho</span>
        <span id="pecho" class="no">—</span>
    </div>

</div>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const zona =
    document.getElementById("zonaCamara");

const balon =
    document.getElementById("balon");

const estado =
    document.getElementById("estado");

const contadorTexto =
    document.getElementById("contador");

const activar =
    document.getElementById("activar");

const empezar =
    document.getElementById("empezar");

const reiniciar =
    document.getElementById("reiniciar");

const cambiar =
    document.getElementById("cambiar");

const calibrar =
    document.getElementById("calibrar");

const zoom =
    document.getElementById("zoom");

const zoomTexto =
    document.getElementById("zoomTexto");


/* =========================================================
   VARIABLES
========================================================= */

let stream = null;

let track = null;

let capacidades = null;

let detector = null;

let camaraTrasera = true;

let deteccionActiva = false;

let jugando = false;

let contador = 0;

let escalaCuerpo = 1;


/* =========================================================
   SUAVIZADO
========================================================= */

const puntosSuavizados = {};

const FACTOR_SUAVIZADO = 0.60;


/* =========================================================
   CARGAR MOVENET
========================================================= */

async function cargarDetector() {

    estado.textContent =
        "🧠 Cargando MoveNet...";

    await tf.ready();

    try {

        await tf.setBackend("webgl");

        await tf.ready();

    } catch (e) {

        console.log(
            "WebGL no disponible"
        );

    }

    detector =
        await poseDetection.createDetector(

            poseDetection.SupportedModels.MoveNet,

            {

                modelType:
                    poseDetection.movenet.modelType.SINGLEPOSE_THUNDER,

                enableSmoothing: true

            }

        );

    estado.textContent =
        "🧠 MoveNet preparado";

}


/* =========================================================
   CÁMARA
========================================================= */

async function iniciarCamara() {

    if (stream) {

        stream.getTracks().forEach(
            pista => pista.stop()
        );

    }

    const facing =
        camaraTrasera
            ? "environment"
            : "user";


    try {

        estado.textContent =
            "📷 Abriendo cámara...";


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: facing
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 30,
                        max: 30
                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        track =
            stream.getVideoTracks()[0];


        capacidades =
            track.getCapabilities();


        prepararZoom();


        if (!detector) {

            await cargarDetector();

        }


        activar.disabled =
            true;

        empezar.disabled =
            false;

        cambiar.disabled =
            false;

        calibrar.disabled =
            false;

        zoom.disabled =
            false;


        estado.textContent =
            "👤 Buscando cuerpo...";


        comenzarDeteccion();


    } catch (error) {

        console.error(error);

        estado.textContent =
            "❌ No se pudo abrir la cámara";

        alert(
            "No se pudo acceder a la cámara. Comprueba los permisos."
        );

    }

}


/* =========================================================
   ZOOM
========================================================= */

function prepararZoom() {

    if (
        capacidades &&
        capacidades.zoom
    ) {

        zoom.min =
            Math.max(
                0.5,
                capacidades.zoom.min
            );

        zoom.max =
            capacidades.zoom.max;

        zoom.step =
            capacidades.zoom.step || 0.1;

    }

    zoom.value =
        "0.5";

    zoomTexto.textContent =
        "0,5×";

}


zoom.addEventListener(
    "input",
    async () => {

        const valor =
            Number(zoom.value);

        zoomTexto.textContent =
            valor.toFixed(1)
            .replace(".", ",")
            + "×";


        if (
            track &&
            capacidades &&
            capacidades.zoom
        ) {

            try {

                await track.applyConstraints({

                    advanced: [
                        {
                            zoom: valor
                        }
                    ]

                });

                return;

            } catch (e) {

                console.log(e);

            }

        }

    }
);


/* =========================================================
   BOTÓN ACTIVAR
========================================================= */

activar.onclick =
    async () => {

        await iniciarCamara();

    };


/* =========================================================
   CAMBIAR CÁMARA
========================================================= */

cambiar.onclick =
    async () => {

        camaraTrasera =
            !camaraTrasera;

        await iniciarCamara();

    };


/* =========================================================
   OBTENER PUNTO
========================================================= */

function obtenerPunto(indice) {

    if (
        !window.ultimaPose ||
        !window.ultimaPose.keypoints
    ) {

        return null;

    }

    const p =
        window.ultimaPose.keypoints[indice];


    if (!p)
        return null;


    /*
       Umbral bajo para no perder
       los pies de la cámara trasera.
    */

    if (
        p.score !== undefined &&
        p.score < 0.15
    ) {

        return null;

    }


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return null;

    }


    const x =
        p.x /
        video.videoWidth;

    const y =
        p.y /
        video.videoHeight;


    if (
        !puntosSuavizados[indice]
    ) {

        puntosSuavizados[indice] = {
            x,
            y
        };

    } else {

        puntosSuavizados[indice].x +=
            (
                x -
                puntosSuavizados[indice].x
            )
            *
            FACTOR_SUAVIZADO;


        puntosSuavizados[indice].y +=
            (
                y -
                puntosSuavizados[indice].y
            )
            *
            FACTOR_SUAVIZADO;

    }


    return puntosSuavizados[indice];

}


/* =========================================================
   DETECCIÓN
========================================================= */

function comenzarDeteccion() {

    if (deteccionActiva)
        return;


    deteccionActiva = true;


    async function detectar() {

        if (
            !detector ||
            video.readyState < 2
        ) {

            requestAnimationFrame(
                detectar
            );

            return;

        }


        try {

            const poses =
                await detector.estimatePoses(

                    video,

                    {

                        maxPoses: 1,

                        flipHorizontal: false

                    }

                );


            if (
                poses.length
            ) {

                window.ultimaPose =
                    poses[0];


                dibujarPuntos(
                    poses[0]
                );

            } else {

                window.ultimaPose =
                    null;

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                estado.textContent =
                    "🔎 No encuentro el cuerpo";

            }

        } catch (error) {

            console.log(error);

        }


        requestAnimationFrame(
            detectar
        );

    }


    detectar();

}


/* =========================================================
   DIBUJAR PUNTOS
========================================================= */

function dibujarPuntos(pose) {

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let cantidad = 0;


    pose.keypoints.forEach(
        (p, indice) => {

            if (
                p.score < 0.15
            ) {

                return;

            }


            cantidad++;


            let radio = 7;

            let color =
                "#00ff55";


            /*
               Rodillas.
            */

            if (
                indice === 13 ||
                indice === 14
            ) {

                color =
                    "#ffee00";

                radio =
                    10;

            }


            /*
               Tobillos.
            */

            if (
                indice === 15 ||
                indice === 16
            ) {

                color =
                    "#ff3333";

                radio =
                    11;

            }


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                radio,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                color;

            ctx.fill();

        }
    );


    if (cantidad >= 12) {

        estado.textContent =
            "🟢 ¡Cuerpo detectado!";

    }

    else if (cantidad >= 7) {

        estado.textContent =
            "🟡 Cuerpo parcialmente detectado";

    }

    else {

        estado.textContent =
            "🔴 Detección insuficiente";

    }


    actualizarIndicadores();

}


/* =========================================================
   INDICADORES
========================================================= */

function actualizarIndicadores() {

    ponerEstado(
        "rodillaI",
        obtenerPunto(13)
    );

    ponerEstado(
        "rodillaD",
        obtenerPunto(14)
    );

    ponerEstado(
        "pieI",
        obtenerPunto(15)
    );

    ponerEstado(
        "pieD",
        obtenerPunto(16)
    );


    const hI =
        obtenerPunto(5);

    const hD =
        obtenerPunto(6);

    const cI =
        obtenerPunto(11);

    const cD =
        obtenerPunto(12);


    if (
        hI &&
        hD &&
        cI &&
        cD
    ) {

        ponerEstado(
            "pecho",
            {}
        );

    } else {

        ponerEstado(
            "pecho",
            null
        );

    }

}


function ponerEstado(
    id,
    punto
) {

    const elemento =
        document.getElementById(id);


    if (punto) {

        elemento.textContent =
            "✓";

        elemento.className =
            "ok";

    } else {

        elemento.textContent =
            "—";

        elemento.className =
            "no";

    }

}


/* =========================================================
   CALIBRACIÓN
========================================================= */

calibrar.onclick =
    () => {

        const cabeza =
            obtenerPunto(0);


        const tobilloI =
            obtenerPunto(15);

        const tobilloD =
            obtenerPunto(16);


        if (
            !cabeza ||
            (!tobilloI && !tobilloD)
        ) {

            estado.textContent =
                "⚠️ Ponte entero en la cámara";

            return;

        }


        const pie =
            tobilloI || tobilloD;


        const altura =
            Math.abs(
                pie.y -
                cabeza.y
            );


        escalaCuerpo =
            Math.max(
                0.8,
                Math.min(
                    1.15,
                    altura / 0.8
                )
            );


        estado.textContent =
            "🎯 Calibrado";

    };


/* =========================================================
   BALÓN
========================================================= */

const pelota = {

    x: 0.50,

    y: 0.12,

    anteriorX: 0.50,

    anteriorY: 0.12,

    vx: 0,

    vy: 0,

    radio: 0.032,

    activa: false,

    ultimoToque: -10000,

    tipo: ""

};


/* =========================================================
   FÍSICA
========================================================= */

const GRAVEDAD =
    0.00055;


const IMPULSO =
    0.023;


const MAX_IMPULSO =
    0.030;


const BLOQUEO =
    700;


/* =========================================================
   DISTANCIA
========================================================= */

function distancia(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   HITBOX
========================================================= */

function crearHitboxes() {

    const resultado = [];


    const rodillaI =
        obtenerPunto(13);

    const rodillaD =
        obtenerPunto(14);

    const tobilloI =
        obtenerPunto(15);

    const tobilloD =
        obtenerPunto(16);


    /*
       RODILLAS PEQUEÑAS.
    */

    if (rodillaI) {

        resultado.push({

            tipo: "rodilla izquierda",

            x: rodillaI.x,

            y: rodillaI.y,

            radio:
                0.040 *
                escalaCuerpo

        });

    }


    if (rodillaD) {

        resultado.push({

            tipo: "rodilla derecha",

            x: rodillaD.x,

            y: rodillaD.y,

            radio:
                0.040 *
                escalaCuerpo

        });

    }


    /*
       PIES.

       El tobillo es el punto real
       de MoveNet.

       La zona se extiende
       ligeramente hacia abajo.
    */

    if (tobilloI) {

        resultado.push({

            tipo: "pie izquierdo",

            x: tobilloI.x,

            y:
                tobilloI.y +
                0.018,

            radio:
                0.050 *
                escalaCuerpo

        });

    }


    if (tobilloD) {

        resultado.push({

            tipo: "pie derecho",

            x: tobilloD.x,

            y:
                tobilloD.y +
                0.018,

            radio:
                0.050 *
                escalaCuerpo

        });

    }


    /*
       PECHO.
    */

    const hI =
        obtenerPunto(5);

    const hD =
        obtenerPunto(6);

    const cI =
        obtenerPunto(11);

    const cD =
        obtenerPunto(12);


    if (
        hI &&
        hD &&
        cI &&
        cD
    ) {

        resultado.push({

            tipo: "pecho",

            x:
                (
                    hI.x +
                    hD.x +
                    cI.x +
                    cD.x
                ) / 4,

            y:
                (
                    hI.y +
                    hD.y +
                    cI.y +
                    cD.y
                ) / 4,

            radio:
                0.075 *
                escalaCuerpo

        });

    }


    return resultado;

}


/* =========================================================
   TRAYECTORIA
========================================================= */

function tocaTrayectoria(
    anterior,
    actual,
    objetivo,
    radio
) {

    const dx =
        actual.x -
        anterior.x;

    const dy =
        actual.y -
        anterior.y;


    const longitud2 =
        dx * dx +
        dy * dy;


    if (
        longitud2 <
        0.0000001
    ) {

        return distancia(
            actual,
            objetivo
        ) <= radio;

    }


    let t =
        (
            (
                objetivo.x -
                anterior.x
            ) * dx
            +
            (
                objetivo.y -
                anterior.y
            ) * dy
        )
        /
        longitud2;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cercano = {

        x:
            anterior.x +
            dx * t,

        y:
            anterior.y +
            dy * t

    };


    return distancia(
        cercano,
        objetivo
    ) <= radio;

}


/* =========================================================
   COMPROBAR CONTACTO
========================================================= */

function comprobarContacto() {

    if (
        !jugando ||
        !pelota.activa
    ) {

        return;

    }


    const ahora =
        performance.now();


    /*
       0,7 SEGUNDOS ENTRE TOQUES.
    */

    if (
        ahora -
        pelota.ultimoToque
        <
        BLOQUEO
    ) {

        return;

    }


    const hitboxes =
        crearHitboxes();


    /*
       Pies y rodillas primero.
    */

    hitboxes.sort(
        (a, b) => {

            const da =
                distancia(
                    pelota,
                    a
                );

            const db =
                distancia(
                    pelota,
                    b
                );

            return da - db;

        }
    );


    for (
        const hitbox
        of hitboxes
    ) {

        const radio =
            pelota.radio +
            hitbox.radio;


        if (
            tocaTrayectoria(

                {
                    x:
                        pelota.anteriorX,

                    y:
                        pelota.anteriorY

                },

                {
                    x:
                        pelota.x,

                    y:
                        pelota.y

                },

                {
                    x:
                        hitbox.x,

                    y:
                        hitbox.y

                },

                radio

            )
        ) {

            realizarToque(
                hitbox
            );

            return;

        }

    }

}


/* =========================================================
   TOQUE
========================================================= */

function realizarToque(
    hitbox
) {

    const ahora =
        performance.now();


    if (
        ahora -
        pelota.ultimoToque
        <
        BLOQUEO
    ) {

        return;

    }


    pelota.ultimoToque =
        ahora;


    pelota.tipo =
        hitbox.tipo;


    contador++;


    contadorTexto.textContent =
        contador;


    /*
       IMPULSO SEGÚN PARTE.
    */

    let impulso =
        IMPULSO;


    if (
        hitbox.tipo.includes(
            "pie"
        )
    ) {

        impulso *=
            1.05;

    }


    if (
        hitbox.tipo.includes(
            "rodilla"
        )
    ) {

        impulso *=
            0.98;

    }


    if (
        hitbox.tipo ===
        "pecho"
    ) {

        impulso *=
            0.72;

    }


    impulso =
        Math.min(
            impulso,
            MAX_IMPULSO
        );


    /*
       PELOTA HACIA ARRIBA.
    */

    pelota.vy =
        -impulso;


    /*
       Un poquito de movimiento
       lateral según la posición
       del cuerpo.
    */

    pelota.vx =
        pelota.vx *
        0.35;


    /*
       Separar el balón del cuerpo.
    */

    pelota.x =
        Math.max(
            0.04,
            Math.min(
                0.96,
                pelota.x
            )
        );


    pelota.y =
        Math.max(
            0.04,
            pelota.y -
            0.025
        );

}


/* =========================================================
   ACTUALIZAR BALÓN
========================================================= */

let ultimoTiempo =
    performance.now();


function actualizarPelota(
    tiempo
) {

    if (
        !pelota.activa
    ) {

        ultimoTiempo =
            tiempo;

        return;

    }


    let delta =
        tiempo -
        ultimoTiempo;


    ultimoTiempo =
        tiempo;


    delta =
        Math.min(
            delta,
            35
        );


    const factor =
        delta /
        16.67;


    pelota.anteriorX =
        pelota.x;

    pelota.anteriorY =
        pelota.y;


    /*
       GRAVEDAD.
    */

    pelota.vy +=
        GRAVEDAD *
        factor;


    /*
       MOVIMIENTO.
    */

    pelota.x +=
        pelota.vx *
        factor;

    pelota.y +=
        pelota.vy *
        factor;


    /*
       AIRE.
    */

    pelota.vx *=
        Math.pow(
            0.997,
            factor
        );


    /*
       PAREDES.
    */

    if (
        pelota.x <
        0.035
    ) {

        pelota.x =
            0.035;

        pelota.vx =
            Math.abs(
                pelota.vx
            ) * 0.70;

    }


    if (
        pelota.x >
        0.965
    ) {

        pelota.x =
            0.965;

        pelota.vx =
            -Math.abs(
                pelota.vx
            ) * 0.70;

    }


    /*
       SI CAE FUERA.

       Reiniciar arriba.
    */

    if (
        pelota.y >
        1.08
    ) {

        pelota.x =
            0.45 +
            Math.random() *
            0.10;

        pelota.y =
            0.12;

        pelota.vx =
            0;

        pelota.vy =
            0.001;

    }


    comprobarContacto();


    /*
       DIBUJAR.
    */

    balon.style.left =
        (
            pelota.x *
            zona.clientWidth
        )
        + "px";


    balon.style.top =
        (
            pelota.y *
            zona.clientHeight
        )
        + "px";

}


/* =========================================================
   BUCLE FÍSICA
========================================================= */

function bucleFisica(
    tiempo
) {

    actualizarPelota(
        tiempo
    );


    requestAnimationFrame(
        bucleFisica
    );

}


requestAnimationFrame(
    bucleFisica
);


/* =========================================================
   EMPEZAR
========================================================= */

empezar.onclick =
    () => {

        contador =
            0;

        contadorTexto.textContent =
            "0";


        jugando =
            true;


        pelota.activa =
            true;


        pelota.x =
            0.50;

        pelota.y =
            0.15;


        pelota.anteriorX =
            pelota.x;

        pelota.anteriorY =
            pelota.y;


        pelota.vx =
            0;

        pelota.vy =
            0.001;


        pelota.ultimoToque =
            -10000;


        balon.style.display =
            "block";


        estado.textContent =
            "🔥 ¡Haz toques!";


        empezar.disabled =
            true;

    };


/* =========================================================
   REINICIAR
========================================================= */

reiniciar.onclick =
    () => {

        jugando =
            false;


        pelota.activa =
            false;


        pelota.vx =
            0;

        pelota.vy =
            0;


        pelota.ultimoToque =
            -10000;


        contador =
            0;


        contadorTexto.textContent =
            "0";


        balon.style.display =
            "none";


        empezar.disabled =
            !stream;


        estado.textContent =
            stream
                ? "Pulsa «Empezar»"
                : "Activa la cámara";

    };

</script>
