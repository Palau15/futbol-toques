<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const video =
    document.getElementById("video");


const zonaCamara =
    document.getElementById("zonaCamara");


const balon =
    document.getElementById("balon");


const estado =
    document.getElementById("estado");


const contadorTexto =
    document.getElementById("contador");


const activar =
    document.getElementById("activar");


const empezar =
    document.getElementById("empezar");


const reiniciar =
    document.getElementById("reiniciar");


const cambiarCamara =
    document.getElementById("cambiarCamara");


const calibrar =
    document.getElementById("calibrar");


const zoom =
    document.getElementById("zoom");


/* =====================================================
   VARIABLES GENERALES
===================================================== */

let stream = null;

let trackVideo = null;

let capacidadesVideo = null;

let detector = null;

let puntos = [];

let jugando = false;

let contador = 0;

let camaraTrasera = false;

let animacionDeteccion = null;


/* =====================================================
   HISTORIAL DE MOVIMIENTO
===================================================== */

/*
   Guardamos posiciones anteriores
   para calcular la velocidad
   aproximada de cada parte.
*/

const historial = {};

const VELOCIDAD_SUAVIZADA = 0.45;


function obtenerPosicionSuavizada(
    nombre,
    x,
    y
) {

    if (!historial[nombre]) {

        historial[nombre] = {

            x: x,

            y: y,

            vx: 0,

            vy: 0

        };

        return historial[nombre];

    }


    const anterior =
        historial[nombre];


    const vx =
        x - anterior.x;


    const vy =
        y - anterior.y;


    anterior.vx =
        anterior.vx *
        (1 - VELOCIDAD_SUAVIZADA)
        +
        vx *
        VELOCIDAD_SUAVIZADA;


    anterior.vy =
        anterior.vy *
        (1 - VELOCIDAD_SUAVIZADA)
        +
        vy *
        VELOCIDAD_SUAVIZADA;


    anterior.x +=
        (x - anterior.x)
        * VELOCIDAD_SUAVIZADA;


    anterior.y +=
        (y - anterior.y)
        * VELOCIDAD_SUAVIZADA;


    return anterior;

}


/* =====================================================
   CALIBRACIÓN
===================================================== */

let escalaCuerpo = 1;


function recalibrar() {

    /*
       Buscamos hombros y pies
       para calcular cuánto ocupa
       el jugador.
    */

    const cabeza =
        obtenerPunto(0);


    const pieI =
        obtenerPunto(19);


    const pieD =
        obtenerPunto(20);


    if (
        !cabeza ||
        (!pieI && !pieD)
    ) {

        estado.textContent =
            "⚠️ No puedo calibrar todavía";

        return;

    }


    let pieMasAbajo =
        pieI || pieD;


    if (
        pieD &&
        pieD.y > pieMasAbajo.y
    ) {

        pieMasAbajo =
            pieD;

    }


    const altura =
        Math.abs(
            pieMasAbajo.y -
            cabeza.y
        );


    /*
       Limitamos el factor
       para evitar hitboxes absurdas.
    */

    escalaCuerpo =
        Math.max(
            0.75,
            Math.min(
                1.45,
                altura / 0.75
            )
        );


    estado.textContent =
        "🎯 ¡Calibración realizada!";

}


/* =====================================================
   CARGAR MOVENET
===================================================== */

async function cargarModelo() {

    estado.textContent =
        "🧠 Cargando detector...";


    await tf.ready();


    try {

        await tf.setBackend(
            "webgl"
        );

        await tf.ready();

    } catch (e) {

        console.log(
            "WebGL no disponible"
        );

    }


    detector =
        await poseDetection.createDetector(

            poseDetection.SupportedModels.MoveNet,

            {

                modelType:
                    poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,

                enableSmoothing:
                    true

            }

        );


    estado.textContent =
        "🧠 Detector preparado";

}


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara() {

    /*
       Parar cámara anterior.
    */

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    const facingMode =
        camaraTrasera
        ? "environment"
        : "user";


    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode:

                        {
                            ideal:
                                facingMode
                        },

                    width: {

                        ideal: 1280

                    },

                    height: {

                        ideal: 720

                    },

                    frameRate: {

                        ideal: 30,

                        max: 30

                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        trackVideo =
            stream.getVideoTracks()[0];


        capacidadesVideo =
            trackVideo.getCapabilities();


        activar.disabled =
            true;


        empezar.disabled =
            false;


        cambiarCamara.disabled =
            false;


        calibrar.disabled =
            false;


        zoom.disabled =
            false;


        configurarZoom();


        if (!detector) {

            await cargarModelo();

        }


        comenzarDeteccion();


        actualizarEspejo();


        estado.textContent =
            "📷 Cámara preparada";


    } catch (error) {

        console.error(error);


        estado.textContent =
            "❌ Error al abrir la cámara";


        alert(
            "No se pudo acceder a la cámara. Comprueba los permisos."
        );

    }

}


/* =====================================================
   ZOOM
===================================================== */

function configurarZoom() {

    if (
        capacidadesVideo &&
        capacidadesVideo.zoom
    ) {

        zoom.min =
            capacidadesVideo.zoom.min;


        zoom.max =
            capacidadesVideo.zoom.max;


        zoom.step =
            capacidadesVideo.zoom.step ||
            0.1;


        zoom.value =
            capacidadesVideo.zoom.min;

    }

}


zoom.addEventListener(
    "input",
    async () => {

        const valor =
            Number(zoom.value);


        /*
           Zoom REAL
        */

        if (
            trackVideo &&
            capacidadesVideo &&
            capacidadesVideo.zoom
        ) {

            try {

                await trackVideo.applyConstraints({

                    advanced: [

                        {
                            zoom: valor
                        }

                    ]

                });

                return;

            } catch (e) {

                console.log(
                    "Zoom real no disponible"
                );

            }

        }


        /*
           Zoom visual alternativo
        */

        const espejo =
            camaraTrasera
            ? ""
            : "scaleX(-1)";


        video.style.transform =
            `${espejo} scale(${valor})`;

    }
);


/* =====================================================
   ESPEJO
===================================================== */

function actualizarEspejo() {

    /*
       Frontal = espejo.

       Trasera = normal.
    */

    if (camaraTrasera) {

        video.style.transform =
            "none";

    } else {

        video.style.transform =
            "scaleX(-1)";

    }

}


/* =====================================================
   BOTÓN ACTIVAR
===================================================== */

activar.onclick =
    async () => {

        await iniciarCamara();

    };


/* =====================================================
   CAMBIAR CÁMARA
===================================================== */

cambiarCamara.onclick =
    async () => {

        camaraTrasera =
            !camaraTrasera;


        estado.textContent =
            "📷 Cambiando cámara...";


        await iniciarCamara();

    };


/* =====================================================
   DETECCIÓN MOVENET
===================================================== */

function comenzarDeteccion() {

    if (animacionDeteccion) {

        cancelAnimationFrame(
            animacionDeteccion
        );

    }


    async function detectar() {

        if (
            !detector ||
            video.readyState < 2
        ) {

            animacionDeteccion =
                requestAnimationFrame(
                    detectar
                );

            return;

        }


        try {

            const poses =
                await detector.estimatePoses(

                    video,

                    {

                        maxPoses: 1,

                        flipHorizontal:
                            false

                    }

                );


            if (
                poses &&
                poses.length
            ) {

                puntos =
                    poses[0].keypoints || [];


                procesarPose();

            } else {

                puntos = [];

                estado.textContent =
                    "👤 No detecto el cuerpo";

            }

        } catch (error) {

            console.error(error);

        }


        animacionDeteccion =
            requestAnimationFrame(
                detectar
            );

    }


    detectar();

}


/* =====================================================
   OBTENER PUNTO MOVENET
===================================================== */

function obtenerPunto(indice) {

    const p =
        puntos[indice];


    if (!p) {

        return null;

    }


    /*
       Umbral relativamente bajo
       para no perder pies/rodillas
       cuando hay movimiento.
    */

    if (
        p.score !== undefined &&
        p.score < 0.22
    ) {

        return null;

    }


    if (
        p.x === undefined ||
        p.y === undefined
    ) {

        return null;

    }


    const x =
        p.x /
        video.videoWidth;


    const y =
        p.y /
        video.videoHeight;


    return obtenerPosicionSuavizada(

        "p" + indice,

        x,

        y

    );

}


/* =====================================================
   PROCESAR POSE
===================================================== */

function procesarPose() {

    const rodillaI =
        obtenerPunto(13);


    const rodillaD =
        obtenerPunto(14);


    const tobilloI =
        obtenerPunto(15);


    const tobilloD =
        obtenerPunto(16);


    const talonI =
        obtenerPunto(21);


    const talonD =
        obtenerPunto(22);


    const puntaI =
        obtenerPunto(19);


    const puntaD =
        obtenerPunto(20);


    actualizarTexto(
        "rodillaI",
        rodillaI
    );


    actualizarTexto(
        "rodillaD",
        rodillaD
    );


    actualizarTexto(
        "pieI",
        tobilloI ||
        talonI ||
        puntaI
    );


    actualizarTexto(
        "pieD",
        tobilloD ||
        talonD ||
        puntaD
    );


    const hombroI =
        obtenerPunto(5);


    const hombroD =
        obtenerPunto(6);


    const caderaI =
        obtenerPunto(11);


    const caderaD =
        obtenerPunto(12);


    let pecho =
        null;


    if (
        hombroI &&
        hombroD &&
        caderaI &&
        caderaD
    ) {

        pecho = {

            x:
                (
                    hombroI.x +
                    hombroD.x +
                    caderaI.x +
                    caderaD.x
                ) / 4,

            y:
                (
                    hombroI.y +
                    hombroD.y +
                    caderaI.y +
                    caderaD.y
                ) / 4

        };

    }


    actualizarTexto(
        "pecho",
        pecho
    );

}


/* =====================================================
   TEXTO
===================================================== */

function actualizarTexto(
    id,
    punto
) {

    const elemento =
        document.getElementById(id);


    if (punto) {

        elemento.textContent =
            "✓";


        elemento.className =
            "ok";

    } else {

        elemento.textContent =
            "—";


        elemento.className =
            "no";

    }

}


/* =====================================================
   BALÓN
===================================================== */

const pelota = {

    x: 0.5,

    y: 0.18,

    vx: 0,

    vy: 0,

    radio: 0.032,

    activa: false,

    ultimoContacto: null

};


/*
   GRAVEDAD
*/

const GRAVEDAD =
    0.00070;


/*
   Velocidad mínima
   después de un toque.
*/

const IMPULSO_MINIMO =
    0.014;


/*
   Velocidad máxima
   para que el balón no salga
   disparado.
*/

const IMPULSO_MAXIMO =
    0.026;


/* =====================================================
   HITBOX DEL PIE
===================================================== */

function crearHitboxPie(
    nombre,
    tobillo,
    talon,
    punta
) {

    const puntosPie = [];


    if (tobillo)
        puntosPie.push(tobillo);


    if (talon)
        puntosPie.push(talon);


    if (punta)
        puntosPie.push(punta);


    if (!puntosPie.length)
        return null;


    /*
       Calculamos el centro del pie.
    */

    let centroX = 0;

    let centroY = 0;


    for (
        const p
        of puntosPie
    ) {

        centroX += p.x;

        centroY += p.y;

    }


    centroX /=
        puntosPie.length;


    centroY /=
        puntosPie.length;


    /*
       Una hitbox amplia.

       Mucho más grande que
       un único punto.
    */

    return {

        nombre,

        puntos:
            puntosPie,

        centro: {

            x: centroX,

            y: centroY

        },

        radio:
            0.095 *
            escalaCuerpo

    };

}


/* =====================================================
   TODAS LAS HITBOXES
===================================================== */

function obtenerHitboxes() {

    const hitboxes = [];


    const tobilloI =
        obtenerPunto(15);


    const talonI =
        obtenerPunto(21);


    const puntaI =
        obtenerPunto(19);


    const pieI =
        crearHitboxPie(

            "pie izquierdo",

            tobilloI,

            talonI,

            puntaI

        );


    if (pieI)
        hitboxes.push(pieI);


    const tobilloD =
        obtenerPunto(16);


    const talonD =
        obtenerPunto(22);


    const puntaD =
        obtenerPunto(20);


    const pieD =
        crearHitboxPie(

            "pie derecho",

            tobilloD,

            talonD,

            puntaD

        );


    if (pieD)
        hitboxes.push(pieD);


    /*
       RODILLAS
    */

    const rodillaI =
        obtenerPunto(13);


    if (rodillaI) {

        hitboxes.push({

            nombre:
                "rodilla izquierda",

            puntos:
                [rodillaI],

            centro:
                rodillaI,

            radio:
                0.10 *
                escalaCuerpo

        });

    }


    const rodillaD =
        obtenerPunto(14);


    if (rodillaD) {

        hitboxes.push({

            nombre:
                "rodilla derecha",

            puntos:
                [rodillaD],

            centro:
                rodillaD,

            radio:
                0.10 *
                escalaCuerpo

        });

    }


    /*
       PECHO
    */

    const hombroI =
        obtenerPunto(5);


    const hombroD =
        obtenerPunto(6);


    const caderaI =
        obtenerPunto(11);


    const caderaD =
        obtenerPunto(12);


    if (
        hombroI &&
        hombroD &&
        caderaI &&
        caderaD
    ) {

        const pecho = {

            x:
                (
                    hombroI.x +
                    hombroD.x +
                    caderaI.x +
                    caderaD.x
                ) / 4,

            y:
                (
                    hombroI.y +
                    hombroD.y +
                    caderaI.y +
                    caderaD.y
                ) / 4

        };


        hitboxes.push({

            nombre:
                "pecho",

            puntos:
                [pecho],

            centro:
                pecho,

            radio:
                0.16 *
                escalaCuerpo

        });

    }


    return hitboxes;

}


/* =====================================================
   DISTANCIA
===================================================== */

function distancia(
    a,
    b
) {

    const dx =
        a.x - b.x;


    const dy =
        a.y - b.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   VELOCIDAD DE UNA PARTE
===================================================== */

function obtenerVelocidad(
    punto
) {

    if (!punto)
        return {

            x: 0,

            y: 0

        };


    /*
       Encontramos el historial
       correspondiente.

       Los puntos suavizados
       conservan su velocidad.
    */

    for (
        const clave
        in historial
    ) {

        const h =
            historial[clave];


        if (
            Math.abs(
                h.x - punto.x
            ) < 0.00001 &&
            Math.abs(
                h.y - punto.y
            ) < 0.00001
        ) {

            return {

                x: h.vx,

                y: h.vy

            };

        }

    }


    return {

        x: 0,

        y: 0

    };

}


/* =====================================================
   COMPROBAR CONTACTO
===================================================== */

function comprobarContacto() {

    if (
        !jugando ||
        !pelota.activa
    ) {

        return;

    }


    const hitboxes =
        obtenerHitboxes();


    /*
       Hitbox del balón.

       Aumentamos ligeramente el tamaño
       para que el juego sea cómodo.
    */

    const radioBalon =
        pelota.radio *
        1.35;


    for (
        const hitbox
        of hitboxes
    ) {


        /*
           Comprobamos todos los puntos
           del pie.

           No solo el centro.
        */

        for (
            const punto
            of hitbox.puntos
        ) {

            const d =
                distancia(
                    pelota,
                    punto
                );


            if (
                d <
                hitbox.radio +
                radioBalon
            ) {

                realizarToque(
                    hitbox,
                    punto
                );


                return;

            }

        }

    }

}


/* =====================================================
   TOQUE
===================================================== */

function realizarToque(
    hitbox,
    punto
) {

    const ahora =
        performance.now();


    /*
       Tiempo mínimo entre contactos.
    */

    if (
        ahora -
        pelota.ultimoContacto <
        280
    ) {

        return;

    }


    /*
       Evitar que el mismo punto
       cuente repetidamente.
    */

    if (
        pelota.ultimoContactoTipo ===
        hitbox.nombre &&

        ahora -
        pelota.ultimoContacto <
        450
    ) {

        return;

    }


    pelota.ultimoContacto =
        ahora;


    pelota.ultimoContactoTipo =
        hitbox.nombre;


    /*
       SUMAR TOQUE
    */

    contador++;

    contadorTexto.textContent =
        contador;


    /*
       VELOCIDAD DE LA PARTE
    */

    const velocidad =
        obtenerVelocidad(
            punto
        );


    /*
       Velocidad vertical
       de la pierna.

       Si la pierna se mueve hacia arriba,
       el balón recibe más impulso.
    */

    let impulso =
        Math.abs(
            velocidad.y
        );


    /*
       Convertimos la velocidad
       de la pierna en fuerza.
    */

    impulso =
        IMPULSO_MINIMO +
        impulso *
        0.75;


    /*
       Limitar fuerza.
    */

    impulso =
        Math.max(
            IMPULSO_MINIMO,
            Math.min(
                IMPULSO_MAXIMO,
                impulso
            )
        );


    /*
       PIE

       Los pies pueden golpear
       con más fuerza.
    */

    if (
        hitbox.nombre.includes(
            "pie"
        )
    ) {

        impulso *=
            1.08;

    }


    /*
       RODILLA
    */

    if (
        hitbox.nombre.includes(
            "rodilla"
        )
    ) {

        impulso *=
            0.95;

    }


    /*
       PECHO

       El pecho produce un toque
       más suave.
    */

    if (
        hitbox.nombre ===
        "pecho"
    ) {

        impulso *=
            0.75;

    }


    /*
       Limitar de nuevo.
    */

    impulso =
        Math.max(
            0.010,
            Math.min(
                0.027,
                impulso
            )
        );


    /*
       DIRECCIÓN HORIZONTAL

       Usamos el movimiento de la parte
       del cuerpo.

       Así el balón puede salir
       ligeramente hacia un lado.
    */

    let horizontal =
        velocidad.x *
        0.65;


    /*
       Añadir pequeño efecto lateral
       según izquierda/derecha.
    */

    if (
        hitbox.nombre.includes(
            "izquierdo"
        )
    ) {

        horizontal -=
            0.0015;

    }


    if (
        hitbox.nombre.includes(
            "derecho"
        )
    ) {

        horizontal +=
            0.0015;

    }


    /*
       Limitar horizontal.
    */

    horizontal =
        Math.max(
            -0.010,
            Math.min(
                0.010,
                horizontal
            )
        );


    /*
       APLICAR FÍSICA
    */

    pelota.vy =
        -impulso;


    pelota.vx =
        horizontal;


    /*
       Colocar el balón
       ligeramente por encima
       de la zona de contacto.
    */

    pelota.x =
        Math.max(
            0.04,
            Math.min(
                0.96,
                punto.x
            )
        );


    pelota.y =
        Math.max(
            0.04,
            punto.y -
            0.025
        );

}


/* =====================================================
   FÍSICA DEL BALÓN
===================================================== */

let ultimoFrame =
    performance.now();


function actualizarPelota(
    tiempo
) {

    if (
        !pelota.activa
    ) {

        return;

    }


    let delta =
        tiempo -
        ultimoFrame;


    ultimoFrame =
        tiempo;


    /*
       Evitar saltos enormes
       cuando el móvil pierde frames.
    */

    delta =
        Math.min(
            delta,
            40
        );


    const factor =
        delta /
        16.67;


    /*
       GRAVEDAD
    */

    pelota.vy +=
        GRAVEDAD *
        factor;


    /*
       MOVIMIENTO
    */

    pelota.x +=
        pelota.vx *
        factor;


    pelota.y +=
        pelota.vy *
        factor;


    /*
       RESISTENCIA DEL AIRE
    */

    pelota.vx *=
        Math.pow(
            0.994,
            factor
        );


    /*
       PAREDES
    */

    if (
        pelota.x <
        0.035
    ) {

        pelota.x =
            0.035;


        pelota.vx =
            Math.abs(
                pelota.vx
            ) *
            0.80;

    }


    if (
        pelota.x >
        0.965
    ) {

        pelota.x =
            0.965;


        pelota.vx =
            -Math.abs(
                pelota.vx
            ) *
            0.80;

    }


    /*
       SI EL BALÓN CAE FUERA

       Lo volvemos a lanzar desde arriba.
    */

    if (
        pelota.y >
        1.08
    ) {

        pelota.x =
            0.45 +
            Math.random() *
            0.10;


        pelota.y =
            0.12;


        pelota.vx =
            0;


        pelota.vy =
            0.002;

    }


    /*
       CONTACTO
    */

    comprobarContacto();


    /*
       DIBUJAR BALÓN
    */

    const ancho =
        zonaCamara.clientWidth;


    const alto =
        zonaCamara.clientHeight;


    const x =
        pelota.x *
        ancho;


    const y =
        pelota.y *
        alto;


    balon.style.left =
        x + "px";


    balon.style.top =
        y + "px";

}


/* =====================================================
   BUCLE DE FÍSICA
===================================================== */

function bucleFisica(
    tiempo
) {

    actualizarPelota(
        tiempo
    );


    requestAnimationFrame(
        bucleFisica
    );

}


requestAnimationFrame(
    bucleFisica
);


/* =====================================================
   EMPEZAR
===================================================== */

empezar.onclick =
    () => {

        /*
           Reiniciar contador.
        */

        contador = 0;

        contadorTexto.textContent =
            "0";


        /*
           Activar partida.
        */

        jugando = true;


        /*
           CREAR BALÓN.

           Antes de este momento
           el balón NO existe.
        */

        pelota.activa =
            true;


        pelota.x =
            0.50;


        pelota.y =
            0.15;


        pelota.vx =
            0;


        pelota.vy =
            0.002;


        pelota.ultimoContacto =
            0;


        pelota.ultimoContactoTipo =
            "";


        /*
           Mostrar balón.
        */

        balon.style.display =
            "block";


        estado.textContent =
            "🔥 ¡Haz toques!";


        empezar.disabled =
            true;

    };


/* =====================================================
   REINICIAR
===================================================== */

reiniciar.onclick =
    () => {

        jugando = false;


        contador = 0;


        contadorTexto.textContent =
            "0";


        pelota.activa =
            false;


        balon.style.display =
            "none";


        pelota.vx =
            0;


        pelota.vy =
            0;


        pelota.ultimoContacto =
            0;


        pelota.ultimoContactoTipo =
            "";


        empezar.disabled =
            !video.srcObject;


        estado.textContent =
            video.srcObject
            ? "Pulsa «Empezar» para generar el balón"
            : "Activa la cámara";

    };


/* =====================================================
   RECALIBRAR
===================================================== */

calibrar.onclick =
    () => {

        recalibrar();

    };

</script>
