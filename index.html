<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Prueba MoveNet</title>


<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<!-- MoveNet -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  background: #111;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

}


h1 {

  margin: 12px 0 5px;

  font-size: 25px;

}


#estado {

  min-height: 25px;

  color: #ddd;

  margin-bottom: 8px;

}


#puntosDetectados {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 8px;

}


/*
   CONTENEDOR DE CÁMARA
*/

#camara {

  position: relative;

  width: 96vw;

  max-width: 700px;

  height: 75vh;

  margin: auto;

  background: black;

  overflow: hidden;

  border-radius: 15px;

}


/*
   VÍDEO
*/

#video {

  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  background: black;

}


/*
   CANVAS

   Se coloca exactamente encima
   del vídeo.
*/

#canvas {

  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;

}


/*
   BOTONES
*/

.botones {

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 8px;

  margin: 12px auto;

  width: 95%;

}


button {

  border: none;

  border-radius: 10px;

  padding: 12px 16px;

  background: #1976d2;

  color: white;

  font-size: 15px;

  font-weight: bold;

}


button:disabled {

  opacity: .45;

}


#activar {

  background: #00a844;

}


#cambiar {

  background: #7b1fa2;

}


#zoomBox {

  width: 90%;

  max-width: 500px;

  margin: 10px auto 20px;

  padding: 10px;

  background: #222;

  border-radius: 12px;

}


#zoom {

  width: 100%;

}


/*
   LEYENDA
*/

#leyenda {

  width: 94%;

  max-width: 600px;

  margin: 15px auto;

  padding: 12px;

  background: #1d1d1d;

  border-radius: 12px;

  text-align: left;

  line-height: 1.5;

  font-size: 14px;

}


.verde {

  color: #00ff55;

}


.amarillo {

  color: #ffee00;

}


.rojo {

  color: #ff5555;

}

</style>

</head>


<body>


<h1>
  🧠 Prueba MoveNet
</h1>


<div id="estado">
  Pulsa «Activar cámara»
</div>


<div id="puntosDetectados">
  Puntos detectados: 0
</div>


<div id="camara">

  <video
    id="video"
    autoplay
    muted
    playsinline
  ></video>


  <canvas
    id="canvas"
  ></canvas>

</div>


<div class="botones">


  <button id="activar">
    📷 Activar cámara
  </button>


  <button
    id="cambiar"
    disabled
  >
    🔄 Cambiar cámara
  </button>


</div>


<div id="zoomBox">

  🔍 Zoom

  <br>

  <input
    id="zoom"
    type="range"
    min="0.5"
    max="3"
    step="0.1"
    value="0.5"
    disabled
  >

  <br>

  <span id="zoomTexto">
    0,5×
  </span>

</div>


<div id="leyenda">

  <b>Qué tienes que comprobar:</b>

  <br><br>

  🟢 <span class="verde">
  Puntos verdes
  </span>
  = partes del cuerpo detectadas.

  <br>

  🟡 <span class="amarillo">
  Amarillo
  </span>
  = rodillas.

  <br>

  🔴 <span class="rojo">
  Rojo
  </span>
  = tobillos/pies.

  <br><br>

  Ponte a una distancia donde aparezcas
  <b>entero</b> en la cámara.

</div>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


const estado =
  document.getElementById(
    "estado"
  );


const puntosTexto =
  document.getElementById(
    "puntosDetectados"
  );


const activar =
  document.getElementById(
    "activar"
  );


const cambiar =
  document.getElementById(
    "cambiar"
  );


const zoom =
  document.getElementById(
    "zoom"
  );


const zoomTexto =
  document.getElementById(
    "zoomTexto"
  );


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let detector = null;

let camaraTrasera = true;

let track = null;

let capabilities = null;

let animacion = null;


/* =====================================================
   PUNTOS DE MOVENET
=====================================================

   MoveNet usa:

   0  nariz
   1  ojo izquierdo
   2  ojo derecho
   3  oreja izquierda
   4  oreja derecha

   5  hombro izquierdo
   6  hombro derecho

   7  codo izquierdo
   8  codo derecho

   9  muñeca izquierda
   10 muñeca derecha

   11 cadera izquierda
   12 cadera derecha

   13 rodilla izquierda
   14 rodilla derecha

   15 tobillo izquierdo
   16 tobillo derecho

===================================================== */


/* =====================================================
   CARGAR MOVENET
===================================================== */

async function cargarMoveNet() {

  estado.textContent =
    "🧠 Cargando MoveNet...";


  /*
     Preparar TensorFlow.
  */

  await tf.ready();


  /*
     Intentar WebGL.
  */

  try {

    await tf.setBackend(
      "webgl"
    );

    await tf.ready();

  }

  catch (error) {

    console.log(
      "WebGL no disponible"
    );

  }


  estado.textContent =
    "🧠 Creando detector...";


  detector =
    await poseDetection.createDetector(

      poseDetection.SupportedModels.MoveNet,

      {

        modelType:
          poseDetection
            .movenet
            .modelType
            .SINGLEPOSE_THUNDER,

        enableSmoothing:
          true

      }

    );


  estado.textContent =
    "✅ MoveNet preparado";

}


/* =====================================================
   ACTIVAR CÁMARA
===================================================== */

async function iniciarCamara() {

  /*
     Parar cámara anterior.
  */

  if (stream) {

    stream
      .getTracks()
      .forEach(
        pista =>
          pista.stop()
      );

  }


  const facing =
    camaraTrasera
      ? "environment"
      : "user";


  estado.textContent =
    "📷 Abriendo cámara...";


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {

              ideal:
                facing

            },

            width: {

              ideal:
                1280

            },

            height: {

              ideal:
                720

            },

            frameRate: {

              ideal: 30,

              max: 30

            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    /*
       Obtener pista.
    */

    track =
      stream
        .getVideoTracks()[0];


    /*
       Obtener capacidades
       del móvil.
    */

    capabilities =
      track
        .getCapabilities();


    /*
       Preparar zoom.
    */

    prepararZoom();


    /*
       Cargar MoveNet.
    */

    if (!detector) {

      await cargarMoveNet();

    }


    activar.disabled =
      true;


    cambiar.disabled =
      false;


    zoom.disabled =
      false;


    estado.textContent =
      "👤 Buscando cuerpo...";


    comenzarDeteccion();

  }

  catch (error) {

    console.error(error);


    estado.textContent =
      "❌ No se pudo abrir la cámara";


    alert(
      "No se pudo acceder a la cámara. Comprueba que has permitido el acceso."
    );

  }

}


/* =====================================================
   ZOOM
===================================================== */

function prepararZoom() {

  /*
     Intentar que empiece en
     0,5×.
  */

  if (
    capabilities &&
    capabilities.zoom
  ) {

    zoom.min =
      Math.max(
        0.5,
        capabilities.zoom.min
      );


    zoom.max =
      capabilities.zoom.max;


    zoom.step =
      capabilities.zoom.step ||
      0.1;


    if (
      0.5 >=
      capabilities.zoom.min &&
      0.5 <=
      capabilities.zoom.max
    ) {

      zoom.value =
        0.5;

    }

  }

  else {

    /*
       El móvil no permite
       controlar el zoom desde
       el navegador.
    */

    zoom.min =
      0.5;

    zoom.max =
      3;

    zoom.value =
      0.5;

  }


  zoomTexto.textContent =
    Number(
      zoom.value
    ).toFixed(1)
    + "×";

}


/* =====================================================
   CAMBIAR ZOOM
===================================================== */

zoom.addEventListener(
  "input",
  async () => {

    const valor =
      Number(
        zoom.value
      );


    zoomTexto.textContent =
      valor.toFixed(1)
      + "×";


    /*
       Zoom real de la cámara.
    */

    if (
      track &&
      capabilities &&
      capabilities.zoom
    ) {

      try {

        await track
          .applyConstraints({

            advanced: [

              {
                zoom:
                  valor
              }

            ]

          });

        return;

      }

      catch (error) {

        console.log(
          "Zoom real no disponible"
        );

      }

    }


    /*
       Zoom digital como
       último recurso.
    */

    const escala =
      Math.max(
        1,
        valor
      );


    if (camaraTrasera) {

      video.style.transform =
        `scale(${escala})`;

    }

    else {

      video.style.transform =
        `scaleX(-1) scale(${escala})`;

    }

  }
);


/* =====================================================
   ACTIVAR
===================================================== */

activar.onclick =
  async () => {

    await iniciarCamara();

  };


/* =====================================================
   CAMBIAR CÁMARA
===================================================== */

cambiar.onclick =
  async () => {

    camaraTrasera =
      !camaraTrasera;


    await iniciarCamara();

  };


/* =====================================================
   PREPARAR CANVAS
===================================================== */

function prepararCanvas() {

  if (
    canvas.width !==
    video.videoWidth
  ) {

    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;

  }

}


/* =====================================================
   DETECCIÓN
===================================================== */

function comenzarDeteccion() {

  if (animacion) {

    cancelAnimationFrame(
      animacion
    );

  }


  async function detectar() {

    if (
      !detector ||
      video.readyState < 2
    ) {

      animacion =
        requestAnimationFrame(
          detectar
        );

      return;

    }


    prepararCanvas();


    try {

      const poses =
        await detector
          .estimatePoses(

            video,

            {

              maxPoses: 1,

              flipHorizontal:
                false

            }

          );


      ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

      );


      if (
        poses.length > 0
      ) {

        dibujarPuntos(
          poses[0]
        );

      }

      else {

        puntosTexto.textContent =
          "Puntos detectados: 0";


        estado.textContent =
          "🔎 No encuentro el cuerpo";

      }

    }

    catch (error) {

      console.error(error);

      estado.textContent =
        "⚠️ Error detectando";

    }


    animacion =
      requestAnimationFrame(
        detectar
      );

  }


  detectar();

}


/* =====================================================
   DIBUJAR PUNTOS
===================================================== */

function dibujarPuntos(
  pose
) {

  const keypoints =
    pose.keypoints;


  let cantidad =
    0;


  /*
     Recorrer los 17 puntos.
  */

  keypoints.forEach(
    (punto, indice) => {

      /*
         Umbral relativamente
         bajo para comprobar
         que MoveNet realmente
         encuentra el cuerpo.
      */

      if (
        punto.score < 0.20
      ) {

        return;

      }


      cantidad++;


      /*
         COLOR.

         Rodillas:
         amarillo.

         Tobillos:
         rojo.

         Resto:
         verde.
      */

      let color =
        "#00ff55";


      if (
        indice === 13 ||
        indice === 14
      ) {

        color =
          "#ffee00";

      }


      if (
        indice === 15 ||
        indice === 16
      ) {

        color =
          "#ff3333";

      }


      /*
         Tamaño.
      */

      let radio =
        9;


      if (
        indice === 13 ||
        indice === 14
      ) {

        radio =
          12;

      }


      if (
        indice === 15 ||
        indice === 16
      ) {

        radio =
          13;

      }


      /*
         Dibujar.
      */

      ctx.beginPath();


      ctx.arc(

        punto.x,

        punto.y,

        radio,

        0,

        Math.PI * 2

      );


      ctx.fillStyle =
        color;


      ctx.fill();


      /*
         Borde.
      */

      ctx.lineWidth =
        3;


      ctx.strokeStyle =
        "#000";


      ctx.stroke();


    }
  );


  puntosTexto.textContent =
    "Puntos detectados: "
    +
    cantidad;


  /*
     Mensaje según detección.
  */

  if (
    cantidad >= 12
  ) {

    estado.textContent =
      "🟢 ¡Cuerpo detectado correctamente!";

  }

  else if (
    cantidad >= 7
  ) {

    estado.textContent =
      "🟡 Cuerpo detectado parcialmente";

  }

  else {

    estado.textContent =
      "🔴 Detección insuficiente";

  }

}


/* =====================================================
   REDIMENSIONAR
===================================================== */

window.addEventListener(
  "resize",
  () => {

    prepararCanvas();

  }
);

</script>

</body>

</html>
