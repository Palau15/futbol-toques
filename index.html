<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fútbol Toques ⚽</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 30px;
    }

    #estado {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 10px;
    }

    #contador {
      font-size: 60px;
      font-weight: bold;
      margin: 5px 0 15px;
    }

    #zonaCamara {
      position: relative;
      width: 95%;
      max-width: 900px;
      margin: auto;
      overflow: hidden;
      border-radius: 15px;
      background: #000;
    }

    #video {
      width: 100%;
      display: block;
      transform: scaleX(-1);
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .botones {
      margin: 15px auto;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #activar {
      background: #00c853;
      color: white;
    }

    #empezar {
      background: #1976d2;
      color: white;
    }

    #reiniciar {
      background: #d32f2f;
      color: white;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #datos {
      width: 95%;
      max-width: 900px;
      margin: 15px auto 30px;
      padding: 15px;
      border-radius: 15px;
      background: #222;
      text-align: left;
    }

    .dato {
      margin: 8px 0;
      font-size: 17px;
    }

    .punto {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .izq {
      background: #2196f3;
    }

    .der {
      background: #ff5252;
    }
  </style>
</head>

<body>

  <h1>⚽ Fútbol Toques</h1>

  <div id="estado">
    Pulsa «Activar cámara» para empezar
  </div>

  <div id="contador">0</div>

  <div id="zonaCamara">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="botones">
    <button id="activar">📷 Activar cámara</button>
    <button id="empezar" disabled>▶️ Empezar</button>
    <button id="reiniciar">🔄 Reiniciar</button>
  </div>

  <div id="datos">

    <div class="dato">
      <span class="punto izq"></span>
      🦵 Rodilla izquierda:
      <strong id="rodillaIzq">No detectada</strong>
    </div>

    <div class="dato">
      <span class="punto der"></span>
      🦵 Rodilla derecha:
      <strong id="rodillaDer">No detectada</strong>
    </div>

    <div class="dato">
      🦶 Tobillo izquierdo:
      <strong id="tobilloIzq">No detectado</strong>
    </div>

    <div class="dato">
      🦶 Tobillo derecho:
      <strong id="tobilloDer">No detectado</strong>
    </div>

  </div>

<script>

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const activarBtn = document.getElementById("activar");
  const empezarBtn = document.getElementById("empezar");
  const reiniciarBtn = document.getElementById("reiniciar");

  const estado = document.getElementById("estado");
  const contadorTexto = document.getElementById("contador");

  const rodillaIzqTexto = document.getElementById("rodillaIzq");
  const rodillaDerTexto = document.getElementById("rodillaDer");

  const tobilloIzqTexto = document.getElementById("tobilloIzq");
  const tobilloDerTexto = document.getElementById("tobilloDer");

  let contador = 0;
  let empezado = false;

  let ultimoYIzq = null;
  let ultimoYDer = null;

  let ultimoToqueIzq = 0;
  let ultimoToqueDer = 0;

  const TIEMPO_ENTRE_TOQUES = 350;

  /*
    MediaPipe Pose
  */

  const pose = new Pose({
    locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    smoothSegmentation: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });


  /*
    RESULTADOS DE MEDIAPIPE
  */

  pose.onResults((results) => {

    if (!video.videoWidth || !video.videoHeight) {
      return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!results.poseLandmarks) {

      estado.textContent = "No se detecta el cuerpo. Ponte delante de la cámara.";

      rodillaIzqTexto.textContent = "No detectada";
      rodillaDerTexto.textContent = "No detectada";

      tobilloIzqTexto.textContent = "No detectado";
      tobilloDerTexto.textContent = "No detectado";

      return;
    }

    estado.textContent = "✅ Cuerpo detectado";

    /*
      Dibujar cuerpo
    */

    drawConnectors(
      ctx,
      results.poseLandmarks,
      POSE_CONNECTIONS,
      {
        color: "#00ff00",
        lineWidth: 4
      }
    );

    drawLandmarks(
      ctx,
      results.poseLandmarks,
      {
        color: "#ffffff",
        fillColor: "#00ff00",
        lineWidth: 2,
        radius: 5
      }
    );


    /*
      PUNTOS DE MEDIAPIPE

      25 = rodilla izquierda
      26 = rodilla derecha
      27 = tobillo izquierdo
      28 = tobillo derecho
    */

    const rodillaIzq = results.poseLandmarks[25];
    const rodillaDer = results.poseLandmarks[26];

    const tobilloIzq = results.poseLandmarks[27];
    const tobilloDer = results.poseLandmarks[28];


    /*
      Mostrar detección
    */

    if (rodillaIzq && rodillaIzq.visibility > 0.5) {
      rodillaIzqTexto.textContent = "Detectada ✅";
    } else {
      rodillaIzqTexto.textContent = "No detectada";
    }

    if (rodillaDer && rodillaDer.visibility > 0.5) {
      rodillaDerTexto.textContent = "Detectada ✅";
    } else {
      rodillaDerTexto.textContent = "No detectada";
    }

    if (tobilloIzq && tobilloIzq.visibility > 0.5) {
      tobilloIzqTexto.textContent = "Detectado ✅";
    } else {
      tobilloIzqTexto.textContent = "No detectado";
    }

    if (tobilloDer && tobilloDer.visibility > 0.5) {
      tobilloDerTexto.textContent = "Detectado ✅";
    } else {
      tobilloDerTexto.textContent = "No detectado";
    }


    /*
      CONTADOR DE TOQUES

      Comprobamos el movimiento vertical
      de los tobillos.
    */

    if (!empezado) {
      if (tobilloIzq) {
        ultimoYIzq = tobilloIzq.y;
      }

      if (tobilloDer) {
        ultimoYDer = tobilloDer.y;
      }

      return;
    }


    /*
      PIE IZQUIERDO
    */

    if (
      tobilloIzq &&
      tobilloIzq.visibility > 0.6 &&
      ultimoYIzq !== null
    ) {

      const movimientoIzq = ultimoYIzq - tobilloIzq.y;

      const ahora = Date.now();

      if (
        movimientoIzq > 0.025 &&
        ahora - ultimoToqueIzq > TIEMPO_ENTRE_TOQUES
      ) {

        contador++;

        ultimoToqueIzq = ahora;

        actualizarContador();
      }

      ultimoYIzq = tobilloIzq.y;
    }


    /*
      PIE DERECHO
    */

    if (
      tobilloDer &&
      tobilloDer.visibility > 0.6 &&
      ultimoYDer !== null
    ) {

      const movimientoDer = ultimoYDer - tobilloDer.y;

      const ahora = Date.now();

      if (
        movimientoDer > 0.025 &&
        ahora - ultimoToqueDer > TIEMPO_ENTRE_TOQUES
      ) {

        contador++;

        ultimoToqueDer = ahora;

        actualizarContador();
      }

      ultimoYDer = tobilloDer.y;
    }

  });


  /*
    ACTUALIZAR CONTADOR
  */

  function actualizarContador() {
    contadorTexto.textContent = contador;
  }


  /*
    ACTIVAR CÁMARA
  */

  activarBtn.addEventListener("click", async () => {

    try {

      estado.textContent = "Solicitando permiso para la cámara...";

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },
        audio: false
      });

      video.srcObject = stream;

      await video.play();

      estado.textContent =
        "📷 Cámara activada. Ponte de cuerpo entero delante.";

      empezarBtn.disabled = false;

      activarBtn.disabled = true;

      iniciarMediaPipe();

    } catch (error) {

      console.error(error);

      estado.textContent =
        "❌ No se ha podido activar la cámara.";

      alert(
        "No se ha podido acceder a la cámara. Comprueba que has dado permiso al navegador."
      );

    }

  });


  /*
    INICIAR MEDIAPIPE
  */

  let camera;

  function iniciarMediaPipe() {

    camera = new Camera(video, {

      onFrame: async () => {

        await pose.send({
          image: video
        });

      },

      width: 1280,
      height: 720

    });

    camera.start();

  }


  /*
    EMPEZAR CONTADOR
  */

  empezarBtn.addEventListener("click", () => {

    empezado = true;

    contador = 0;

    ultimoYIzq = null;
    ultimoYDer = null;

    ultimoToqueIzq = 0;
    ultimoToqueDer = 0;

    actualizarContador();

    estado.textContent =
      "🔥 ¡Empieza a hacer toques!";

    empezarBtn.disabled = true;

  });


  /*
    REINICIAR
  */

  reiniciarBtn.addEventListener("click", () => {

    contador = 0;

    empezado = false;

    ultimoYIzq = null;
    ultimoYDer = null;

    ultimoToqueIzq = 0;
    ultimoToqueDer = 0;

    actualizarContador();

    estado.textContent =
      "Pulsa «Empezar» para comenzar.";

    empezarBtn.disabled = !video.srcObject;

  });

</script>

</body>
</html>
