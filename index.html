<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>⚽ Fútbol Toques</title>


<!-- TensorFlow -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>


<!-- MoveNet -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>


<style>

/* ================================
   GENERAL
================================ */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    background: #101010;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

}


h1 {

    margin: 10px 0 3px;

    font-size: 25px;

}


#estado {

    min-height: 22px;

    color: #cccccc;

    font-size: 14px;

}


#contador {

    font-size: 62px;

    font-weight: bold;

    line-height: 1;

    margin: 5px 0 10px;

}


/* ================================
   CÁMARA
================================ */

#zonaCamara {

    position: relative;

    width: 96vw;

    max-width: 900px;

    height: 75vh;

    margin: auto;

    overflow: hidden;

    background: black;

    border-radius: 16px;

}


/*
   IMPORTANTE:

   Cámara DELANTERA
   visualmente en espejo.
*/

#video {

    position: absolute;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

    object-fit: contain;

    transform: scaleX(-1);

}


/* ================================
   BALÓN
================================ */

#balon {

    position: absolute;

    width: 58px;

    height: 58px;

    margin-left: -29px;

    margin-top: -29px;

    display: none;

    z-index: 20;

    pointer-events: none;

    font-size: 48px;

    line-height: 58px;

    filter:
        drop-shadow(
            0 4px 4px
            rgba(0,0,0,.8)
        );

}


/* ================================
   CONTROLES
================================ */

.controles {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

    width: 96%;

    max-width: 800px;

    margin: 10px auto;

}


button {

    border: none;

    border-radius: 11px;

    padding: 12px 17px;

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


#activar {

    background: #00a844;

}


#empezar {

    background: #1976d2;

}


#reiniciar {

    background: #d32f2f;

}


button:disabled {

    opacity: .4;

    cursor: default;

}


/* ================================
   INFORMACIÓN
================================ */

#info {

    width: 94%;

    max-width: 650px;

    margin: 10px auto 25px;

    padding: 10px;

    background: #202020;

    border-radius: 13px;

}


.fila {

    display: flex;

    justify-content: space-between;

    padding: 6px;

    border-bottom: 1px solid #333;

}


.ok {

    color: #55ff77;

}


.no {

    color: #888;

}

</style>

</head>


<body>


<h1>
⚽ Fútbol Toques
</h1>


<div id="estado">
Pulsa «Activar cámara»
</div>


<div id="contador">
0
</div>


<!-- ==========================
     CÁMARA
========================== -->

<div id="zonaCamara">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>


    <div id="balon">
        ⚽
    </div>

</div>


<!-- ==========================
     BOTONES
========================== -->

<div class="controles">

    <button id="activar">
        📷 Activar cámara
    </button>


    <button
        id="empezar"
        disabled>

        ▶️ Empezar

    </button>


    <button id="reiniciar">

        🔄 Reiniciar

    </button>

</div>


<!-- ==========================
     INFORMACIÓN
========================== -->

<div id="info">


    <div class="fila">

        <span>
            🦵 Rodillas
        </span>

        <span
            id="rodillas"
            class="no">

            —

        </span>

    </div>


    <div class="fila">

        <span>
            🦶 Pies
        </span>

        <span
            id="pies"
            class="no">

            —

        </span>

    </div>


    <div class="fila">

        <span>
            🫁 Pecho
        </span>

        <span
            id="pecho"
            class="no">

            —

        </span>

    </div>


</div>


<script>


/* ==================================================
   ELEMENTOS
================================================== */

const video =
    document.getElementById(
        "video"
    );


const zona =
    document.getElementById(
        "zonaCamara"
    );


const balon =
    document.getElementById(
        "balon"
    );


const estado =
    document.getElementById(
        "estado"
    );


const contadorTexto =
    document.getElementById(
        "contador"
    );


const activar =
    document.getElementById(
        "activar"
    );


const empezar =
    document.getElementById(
        "empezar"
    );


const reiniciar =
    document.getElementById(
        "reiniciar"
    );


/* ==================================================
   VARIABLES
================================================== */

let stream = null;

let detector = null;

let ultimaPose = null;

let deteccionIniciada = false;

let jugando = false;

let contador = 0;


/*
   Puntos suavizados.

   Esto evita pequeños saltos
   de MoveNet.
*/

const puntosSuaves = {};

const SUAVIZADO = 0.55;


/*
   Escala moderada.

   Evita hitboxes gigantes.
*/

let escalaCuerpo = 1;


/* ==================================================
   CARGAR MOVENET
================================================== */

async function cargarDetector() {


    estado.textContent =
        "🧠 Cargando MoveNet...";


    await tf.ready();


    /*
       Intentamos utilizar WebGL
       para mejorar rendimiento.
    */

    try {

        await tf.setBackend(
            "webgl"
        );

        await tf.ready();

    } catch (error) {

        console.log(
            "WebGL no disponible"
        );

    }


    detector =
        await poseDetection
            .createDetector(

                poseDetection
                    .SupportedModels
                    .MoveNet,

                {

                    modelType:

                        poseDetection
                            .movenet
                            .modelType
                            .SINGLEPOSE_THUNDER,

                    enableSmoothing:
                        true

                }

            );


    estado.textContent =
        "✅ Detector preparado";

}


/* ==================================================
   CÁMARA DELANTERA
================================================== */

async function iniciarCamara() {


    /*
       Si ya había una cámara,
       la cerramos.
    */

    if (stream) {

        stream
            .getTracks()
            .forEach(
                pista =>
                    pista.stop()
            );

    }


    try {


        estado.textContent =
            "📷 Abriendo cámara...";


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        /*
                           SOLO DELANTERA.
                        */

                        facingMode: {
                            exact: "user"
                        },


                        /*
                           Resolución suficiente
                           para MoveNet.
                        */

                        width: {
                            ideal: 1280
                        },


                        height: {
                            ideal: 720
                        },


                        frameRate: {
                            ideal: 30,
                            max: 30
                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        /*
           Cargar detector.
        */

        if (!detector) {

            await cargarDetector();

        }


        activar.disabled =
            true;


        empezar.disabled =
            false;


        estado.textContent =
            "👤 Buscando cuerpo...";


        iniciarDeteccion();


    }

    catch (error) {


        console.error(
            error
        );


        estado.textContent =
            "❌ Error con la cámara";


        alert(
            "No se pudo abrir la cámara. Comprueba que has permitido el acceso."
        );

    }

}


/* ==================================================
   BOTÓN CÁMARA
================================================== */

activar.onclick =
    async function() {

        await iniciarCamara();

    };


/* ==================================================
   OBTENER PUNTO
================================================== */

function obtenerPunto(
    indice
) {


    /*
       Si no hay pose,
       no podemos detectar.
    */

    if (
        !ultimaPose ||
        !ultimaPose.keypoints
    ) {

        return null;

    }


    const punto =
        ultimaPose
            .keypoints[indice];


    if (!punto) {

        return null;

    }


    /*
       Umbral de confianza.

       Algo bajo para no perder
       los pies fácilmente.
    */

    if (
        punto.score !== undefined &&
        punto.score < 0.20
    ) {

        return null;

    }


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return null;

    }


    /*
       COORDENADAS ESPEJO.

       MoveNet ve la imagen normal.

       La pantalla está reflejada.

       Por eso invertimos X.
    */

    const x =
        1 -
        (
            punto.x /
            video.videoWidth
        );


    const y =
        punto.y /
        video.videoHeight;


    /*
       Suavizado.
    */

    if (
        !puntosSuaves[indice]
    ) {

        puntosSuaves[indice] = {

            x: x,

            y: y

        };

    }

    else {


        puntosSuaves[indice].x +=

            (
                x -
                puntosSuaves[indice].x
            )
            *
            SUAVIZADO;


        puntosSuaves[indice].y +=

            (
                y -
                puntosSuaves[indice].y
            )
            *
            SUAVIZADO;

    }


    return {

        x:
            puntosSuaves[indice].x,

        y:
            puntosSuaves[indice].y

    };

}


/* ==================================================
   DETECCIÓN
================================================== */

function iniciarDeteccion() {


    if (
        deteccionIniciada
    ) {

        return;

    }


    deteccionIniciada =
        true;


    async function detectar() {


        if (
            detector &&
            video.readyState >= 2
        ) {


            try {


                const poses =
                    await detector
                        .estimatePoses(

                            video,

                            {

                                maxPoses: 1,

                                /*
                                   NO invertimos aquí.

                                   Nosotros invertimos
                                   las coordenadas después.
                                */

                                flipHorizontal:
                                    false

                            }

                        );


                if (
                    poses.length > 0
                ) {


                    ultimaPose =
                        poses[0];


                    actualizarEstado();

                }

                else {


                    ultimaPose =
                        null;


                    estado.textContent =
                        "🔎 Buscando cuerpo...";

                }


            }

            catch (error) {

                console.log(
                    error
                );

            }

        }


        requestAnimationFrame(
            detectar
        );

    }


    detectar();

}


/* ==================================================
   ESTADO DE DETECCIÓN
================================================== */

function actualizarEstado() {


    const rodillaI =
        obtenerPunto(13);


    const rodillaD =
        obtenerPunto(14);


    const pieI =
        obtenerPunto(15);


    const pieD =
        obtenerPunto(16);


    /*
       NO utilizamos manos.

       Los índices de las manos
       nunca aparecen en las
       hitboxes.
    */


    document.getElementById(
        "rodillas"
    ).textContent =

        rodillaI ||
        rodillaD

            ? "✓"

            : "—";


    document.getElementById(
        "pies"
    ).textContent =

        pieI ||
        pieD

            ? "✓"

            : "—";


    /*
       PECHO.
    */

    const hombroI =
        obtenerPunto(5);


    const hombroD =
        obtenerPunto(6);


    const caderaI =
        obtenerPunto(11);


    const caderaD =
        obtenerPunto(12);


    const pecho =
        hombroI &&
        hombroD &&
        caderaI &&
        caderaD;


    document.getElementById(
        "pecho"
    ).textContent =

        pecho

            ? "✓"

            : "—";


    if (
        pieI ||
        pieD ||
        rodillaI ||
        rodillaD
    ) {

        estado.textContent =
            "🟢 Cuerpo detectado";

    }

    else {

        estado.textContent =
            "🔎 Buscando piernas...";

    }

}


/* ==================================================
   HITBOXES
================================================== */

function obtenerHitboxes() {


    const resultado = [];


    /*
       =========================
       RODILLA IZQUIERDA
       =========================
    */

    const rodillaI =
        obtenerPunto(13);


    if (rodillaI) {

        resultado.push({

            tipo:
                "rodilla",

            x:
                rodillaI.x,

            y:
                rodillaI.y,

            /*
               HITBOX PEQUEÑA.
            */

            radio:
                0.035 *
                escalaCuerpo

        });

    }


    /*
       =========================
       RODILLA DERECHA
       =========================
    */

    const rodillaD =
        obtenerPunto(14);


    if (rodillaD) {

        resultado.push({

            tipo:
                "rodilla",

            x:
                rodillaD.x,

            y:
                rodillaD.y,

            radio:
                0.035 *
                escalaCuerpo

        });

    }


    /*
       =========================
       PIE IZQUIERDO
       =========================

       MoveNet detecta el tobillo.

       Añadimos una pequeña zona
       hacia abajo para representar
       el pie.
    */

    const pieI =
        obtenerPunto(15);


    if (pieI) {

        resultado.push({

            tipo:
                "pie",

            x:
                pieI.x,

            y:
                pieI.y +
                0.018,

            radio:
                0.045 *
                escalaCuerpo

        });

    }


    /*
       =========================
       PIE DERECHO
       =========================
    */

    const pieD =
        obtenerPunto(16);


    if (pieD) {

        resultado.push({

            tipo:
                "pie",

            x:
                pieD.x,

            y:
                pieD.y +
                0.018,

            radio:
                0.045 *
                escalaCuerpo

        });

    }


    /*
       =========================
       PECHO
       =========================
    */

    const hombroI =
        obtenerPunto(5);


    const hombroD =
        obtenerPunto(6);


    const caderaI =
        obtenerPunto(11);


    const caderaD =
        obtenerPunto(12);


    if (
        hombroI &&
        hombroD &&
        caderaI &&
        caderaD
    ) {


        resultado.push({

            tipo:
                "pecho",


            x:

                (
                    hombroI.x +
                    hombroD.x +
                    caderaI.x +
                    caderaD.x
                )
                / 4,


            y:

                (
                    hombroI.y +
                    hombroD.y +
                    caderaI.y +
                    caderaD.y
                )
                / 4,


            radio:
                0.060 *
                escalaCuerpo

        });

    }


    return resultado;

}


/* ==================================================
   DISTANCIA
================================================== */

function distancia(
    a,
    b
) {


    const dx =
        a.x -
        b.x;


    const dy =
        a.y -
        b.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* ==================================================
   CONTACTO CON TRAYECTORIA
================================================== */

function contactoTrayectoria(

    anterior,

    actual,

    objetivo,

    radio

) {


    const dx =
        actual.x -
        anterior.x;


    const dy =
        actual.y -
        anterior.y;


    const longitud2 =
        dx * dx +
        dy * dy;


    if (
        longitud2 <
        0.0000001
    ) {


        return
            distancia(
                actual,
                objetivo
            )
            <=
            radio;

    }


    let t =

        (

            (
                objetivo.x -
                anterior.x
            )
            *
            dx

            +

            (
                objetivo.y -
                anterior.y
            )
            *
            dy

        )
        /
        longitud2;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const puntoCercano = {

        x:
            anterior.x +
            dx * t,

        y:
            anterior.y +
            dy * t

    };


    return

        distancia(
            puntoCercano,
            objetivo
        )
        <=
        radio;

}


/* ==================================================
   PELOTA
================================================== */

const pelota = {


    x:
        0.50,


    y:
        0.15,


    anteriorX:
        0.50,


    anteriorY:
        0.15,


    vx:
        0,


    vy:
        0,


    /*
       Tamaño del balón.
    */

    radio:
        0.032,


    activa:
        false,


    ultimoToque:
        -10000

};


/* ==================================================
   FÍSICA
================================================== */


/*
   Gravedad.
*/

const GRAVEDAD =
    0.00055;


/*
   IMPULSO.

   Más fuerte que antes.
*/

const IMPULSO =
    0.024;


/*
   Límite.
*/

const MAX_IMPULSO =
    0.030;


/*
   Tiempo entre toques.
*/

const BLOQUEO =
    700;


/* ==================================================
   COMPROBAR CONTACTO
================================================== */

function comprobarContacto() {


    if (
        !jugando ||
        !pelota.activa
    ) {

        return;

    }


    const ahora =
        performance.now();


    /*
       0,7 segundos sin poder
       contar otro toque.
    */

    if (
        ahora -
        pelota.ultimoToque
        <
        BLOQUEO
    ) {

        return;

    }


    const hitboxes =
        obtenerHitboxes();


    /*
       Prioridad:

       PIE
       RODILLA
       PECHO
    */

    const prioridad = {

        pie:
            0,

        rodilla:
            1,

        pecho:
            2

    };


    hitboxes.sort(

        (a, b) =>

            prioridad[a.tipo] -
            prioridad[b.tipo]

    );


    for (
        const h
        of hitboxes
    ) {


        const radio =
            pelota.radio +
            h.radio;


        /*
           Trayectoria del balón.
        */

        const cerca =

            contactoTrayectoria(

                {

                    x:
                        pelota.anteriorX,

                    y:
                        pelota.anteriorY

                },

                {

                    x:
                        pelota.x,

                    y:
                        pelota.y

                },

                {

                    x:
                        h.x,

                    y:
                        h.y

                },

                radio

            );


        if (!cerca) {

            continue;

        }


        /*
           ===========================
           EL BALÓN DEBE ESTAR
           MOVIÉNDOSE HACIA EL CUERPO
           ===========================
        */

        const dx =
            h.x -
            pelota.anteriorX;


        const dy =
            h.y -
            pelota.anteriorY;


        const movimientoX =
            pelota.x -
            pelota.anteriorX;


        const movimientoY =
            pelota.y -
            pelota.anteriorY;


        const producto =
            dx *
            movimientoX

            +

            dy *
            movimientoY;


        /*
           Evita muchos falsos
           positivos.
        */

        if (
            producto <= 0
        ) {

            continue;

        }


        realizarToque(
            h
        );


        return;

    }

}


/* ==================================================
   REALIZAR TOQUE
================================================== */

function realizarToque(
    h
) {


    const ahora =
        performance.now();


    if (
        ahora -
        pelota.ultimoToque
        <
        BLOQUEO
    ) {

        return;

    }


    pelota.ultimoToque =
        ahora;


    contador++;


    contadorTexto.textContent =
        contador;


    /*
       ===========================
       FUERZA DEL TOQUE
       ===========================
    */

    let fuerza =
        IMPULSO;


    /*
       PIE.

       Un poco más fuerte.
    */

    if (
        h.tipo ===
        "pie"
    ) {

        fuerza *=
            1.12;

    }


    /*
       RODILLA.
    */

    if (
        h.tipo ===
        "rodilla"
    ) {

        fuerza *=
            1.04;

    }


    /*
       PECHO.

       Más suave.
    */

    if (
        h.tipo ===
        "pecho"
    ) {

        fuerza *=
            0.78;

    }


    fuerza =
        Math.min(
            fuerza,
            MAX_IMPULSO
        );


    /*
       BALÓN HACIA ARRIBA.
    */

    pelota.vy =
        -fuerza;


    /*
       Mantener un poquito
       del movimiento lateral.
    */

    pelota.vx *=
        0.30;


    /*
       Separación.

       Evita que el balón se quede
       dentro del cuerpo.
    */

    pelota.y -=
        0.025;


    estado.textContent =
        "⚽ ¡TOQUE!";

}


/* ==================================================
   ACTUALIZAR PELOTA
================================================== */

let ultimoTiempo =
    performance.now();


function actualizarPelota(
    tiempo
) {


    if (
        !pelota.activa
    ) {

        ultimoTiempo =
            tiempo;

        return;

    }


    let delta =
        tiempo -
        ultimoTiempo;


    ultimoTiempo =
        tiempo;


    /*
       Evitar saltos grandes.
    */

    delta =
        Math.min(
            delta,
            35
        );


    const factor =
        delta /
        16.67;


    /*
       Guardamos posición
       anterior.
    */

    pelota.anteriorX =
        pelota.x;


    pelota.anteriorY =
        pelota.y;


    /*
       GRAVEDAD.
    */

    pelota.vy +=
        GRAVEDAD *
        factor;


    /*
       MOVIMIENTO.
    */

    pelota.x +=
        pelota.vx *
        factor;


    pelota.y +=
        pelota.vy *
        factor;


    /*
       AIRE.
    */

    pelota.vx *=

        Math.pow(
            0.997,
            factor
        );


    /*
       ===========================
       PARED IZQUIERDA
       ===========================
    */

    if (
        pelota.x <
        0.035
    ) {

        pelota.x =
            0.035;


        pelota.vx =
            Math.abs(
                pelota.vx
            )
            *
            0.65;

    }


    /*
       ===========================
       PARED DERECHA
       ===========================
    */

    if (
        pelota.x >
        0.965
    ) {

        pelota.x =
            0.965;


        pelota.vx =
            -Math.abs(
                pelota.vx
            )
            *
            0.65;

    }


    /*
       ===========================
       SI SE CAE
       ===========================
    */

    if (
        pelota.y >
        1.08
    ) {


        pelota.x =

            0.45 +

            Math.random()
            *
            0.10;


        pelota.y =
            0.12;


        pelota.vx =
            0;


        pelota.vy =
            0.001;

    }


    /*
       COMPROBAR TOQUE.
    */

    comprobarContacto();


    /*
       ===========================
       DIBUJAR BALÓN
       ===========================
    */

    balon.style.left =

        (
            pelota.x *
            zona.clientWidth
        )
        +
        "px";


    balon.style.top =

        (
            pelota.y *
            zona.clientHeight
        )
        +
        "px";

}


/* ==================================================
   BUCLE DE FÍSICA
================================================== */

function bucle(
    tiempo
) {


    actualizarPelota(
        tiempo
    );


    requestAnimationFrame(
        bucle
    );

}


requestAnimationFrame(
    bucle
);


/* ==================================================
   EMPEZAR
================================================== */

empezar.onclick =
    function() {


        contador =
            0;


        contadorTexto.textContent =
            "0";


        jugando =
            true;


        pelota.activa =
            true;


        /*
           BALÓN INICIAL.
        */

        pelota.x =
            0.50;


        pelota.y =
            0.14;


        pelota.anteriorX =
            pelota.x;


        pelota.anteriorY =
            pelota.y;


        pelota.vx =
            0;


        pelota.vy =
            0.001;


        pelota.ultimoToque =
            -10000;


        balon.style.display =
            "block";


        estado.textContent =
            "🔥 ¡Haz toques!";


        empezar.disabled =
            true;

    };


/* ==================================================
   REINICIAR
================================================== */

reiniciar.onclick =
    function() {


        jugando =
            false;


        pelota.activa =
            false;


        pelota.vx =
            0;


        pelota.vy =
            0;


        pelota.ultimoToque =
            -10000;


        contador =
            0;


        contadorTexto.textContent =
            "0";


        balon.style.display =
            "none";


        empezar.disabled =
            !stream;


        estado.textContent =

            stream

                ? "Pulsa «Empezar»"

                : "Activa la cámara";

    };


</script>
