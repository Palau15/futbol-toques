<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚽ Fútbol Toques</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 12px 0 3px;
    font-size: 30px;
}

#estado {
    color: #ccc;
    font-size: 16px;
    margin-bottom: 5px;
}

#contador {
    font-size: 65px;
    font-weight: bold;
    margin: 0 0 10px;
}

#zona {
    position: relative;
    width: 95%;
    max-width: 900px;
    margin: auto;
    overflow: hidden;
    border-radius: 15px;
    background: black;
}

#video {
    width: 100%;
    display: block;

    /* Cámara tipo espejo */
    transform: scaleX(-1);
}

/* BALÓN */

#balon {
    position: absolute;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    display: none;

    z-index: 10;

    pointer-events: none;

    font-size: 48px;
    line-height: 58px;

    text-align: center;

    filter: drop-shadow(0 4px 4px rgba(0,0,0,.6));
}

/* BOTONES */

.botones {
    margin: 15px auto;

    display: flex;
    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 12px;

    padding: 14px 22px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;
}

#activar {
    background: #00a83b;
    color: white;
}

#empezar {
    background: #1976d2;
    color: white;
}

#reiniciar {
    background: #d32f2f;
    color: white;
}

button:disabled {
    opacity: .4;
}

/* INFORMACIÓN */

#info {
    width: 95%;
    max-width: 900px;

    margin: 10px auto 25px;

    background: #222;

    padding: 12px;

    border-radius: 12px;
}

.parte {
    margin: 5px;
    font-size: 16px;
}

</style>
</head>

<body>

<h1>⚽ Fútbol Toques</h1>

<div id="estado">
    Activa la cámara para empezar
</div>

<div id="contador">
    0
</div>

<div id="zona">

    <video id="video" autoplay playsinline></video>

    <!-- El balón empieza oculto -->
    <div id="balon">⚽</div>

</div>

<div class="botones">

    <button id="activar">
        📷 Activar cámara
    </button>

    <button id="empezar" disabled>
        ▶️ Empezar
    </button>

    <button id="reiniciar">
        🔄 Reiniciar
    </button>

</div>

<div id="info">

    <div class="parte">
        🦵 Rodilla izquierda:
        <span id="rI">—</span>
    </div>

    <div class="parte">
        🦵 Rodilla derecha:
        <span id="rD">—</span>
    </div>

    <div class="parte">
        🦶 Pie/tobillo izquierdo:
        <span id="pI">—</span>
    </div>

    <div class="parte">
        🦶 Pie/tobillo derecho:
        <span id="pD">—</span>
    </div>

    <div class="parte">
        🫁 Pecho:
        <span id="pecho">—</span>
    </div>

</div>

<script>

/* ========================================
   ELEMENTOS
======================================== */

const video = document.getElementById("video");

const zona = document.getElementById("zona");

const balon = document.getElementById("balon");

const activar = document.getElementById("activar");

const empezar = document.getElementById("empezar");

const reiniciar = document.getElementById("reiniciar");

const estado = document.getElementById("estado");

const contadorTexto = document.getElementById("contador");


/* ========================================
   VARIABLES
======================================== */

let puntos = [];

let jugando = false;

let contador = 0;

let ultimoToque = 0;


/* ========================================
   BALÓN
======================================== */

let pelota = {

    x: 0.5,

    y: 0.25,

    vx: 0,

    vy: 0,

    radio: 29,

    activa: false

};


/*
   Física del balón
*/

const gravedad = 0.00065;


/*
   Fuerza con la que sube después
   de tocar el cuerpo
*/

const fuerzaToque = -0.017;


/* ========================================
   MEDIAPIPE
======================================== */

const pose = new Pose({

    locateFile: (file) => {

        return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;

    }

});


pose.setOptions({

    modelComplexity: 1,

    smoothLandmarks: true,

    enableSegmentation: false,

    minDetectionConfidence: 0.5,

    minTrackingConfidence: 0.5

});


/*
   MUY IMPORTANTE:

   Aquí NO dibujamos el cuerpo.

   MediaPipe solamente detecta los puntos.
*/

pose.onResults((resultado) => {

    if (!resultado.poseLandmarks) {

        estado.textContent =
            "👤 No detecto tu cuerpo";

        puntos = [];

        return;

    }

    puntos = resultado.poseLandmarks;

    estado.textContent =
        jugando
        ? "🔥 ¡Haz toques!"
        : "✅ Cuerpo detectado";

    actualizarInformacion();

});


/* ========================================
   INFORMACIÓN
======================================== */

function visible(punto) {

    return punto &&
           punto.visibility !== undefined &&
           punto.visibility > 0.5;

}


function actualizarInformacion() {

    const rodillaI = puntos[25];

    const rodillaD = puntos[26];

    const tobilloI = puntos[27];

    const tobilloD = puntos[28];


    document.getElementById("rI").textContent =
        visible(rodillaI) ? "✓" : "—";


    document.getElementById("rD").textContent =
        visible(rodillaD) ? "✓" : "—";


    document.getElementById("pI").textContent =
        visible(tobilloI) ? "✓" : "—";


    document.getElementById("pD").textContent =
        visible(tobilloD) ? "✓" : "—";


    if (
        visible(puntos[11]) &&
        visible(puntos[12]) &&
        visible(puntos[23]) &&
        visible(puntos[24])
    ) {

        document.getElementById("pecho").textContent = "✓";

    } else {

        document.getElementById("pecho").textContent = "—";

    }

}


/* ========================================
   ACTIVAR CÁMARA
======================================== */

activar.onclick = async () => {

    try {

        estado.textContent =
            "📷 Pidiendo permiso para la cámara...";


        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject = stream;

        await video.play();


        activar.disabled = true;

        empezar.disabled = false;


        estado.textContent =
            "📷 Cámara activada. Ponte de cuerpo entero.";


        iniciarMediaPipe();


    } catch (error) {

        console.error(error);

        estado.textContent =
            "❌ No se pudo activar la cámara.";

        alert(
            "No se pudo acceder a la cámara. Comprueba los permisos del navegador."
        );

    }

};


/* ========================================
   INICIAR MEDIAPIPE
======================================== */

function iniciarMediaPipe() {

    const camera = new Camera(video, {

        onFrame: async () => {

            await pose.send({
                image: video
            });

        },

        width: 1280,

        height: 720

    });


    camera.start();

}


/* ========================================
   EMPEZAR PARTIDA
======================================== */

empezar.onclick = () => {

    /*
       Reiniciar contador
    */

    contador = 0;

    contadorTexto.textContent = "0";


    /*
       ACTIVAR JUEGO
    */

    jugando = true;


    /*
       GENERAR BALÓN

       El balón aparece AHORA,
       justo cuando pulsamos empezar.
    */

    pelota.activa = true;


    /*
       Aparece aproximadamente
       en la parte superior.
    */

    pelota.x = 0.5;

    pelota.y = 0.22;


    /*
       Comienza cayendo
    */

    pelota.vx = 0;

    pelota.vy = 0.002;


    /*
       Mostrar balón
    */

    balon.style.display = "block";


    estado.textContent =
        "🔥 ¡Haz toques!";


    empezar.disabled = true;

};


/* ========================================
   REINICIAR
======================================== */

reiniciar.onclick = () => {

    jugando = false;

    contador = 0;

    contadorTexto.textContent = "0";


    pelota.activa = false;


    balon.style.display = "none";


    empezar.disabled =
        !video.srcObject;


    estado.textContent =
        video.srcObject
        ? "Pulsa «Empezar» para generar el balón"
        : "Activa la cámara para empezar";

};


/* ========================================
   DISTANCIA
======================================== */

function distancia(x1, y1, x2, y2) {

    const dx = x1 - x2;

    const dy = y1 - y2;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* ========================================
   CREAR PUNTOS DEL CUERPO
======================================== */

function obtenerPartes() {

    const partes = [];


    /*
       PIE / TOBILLO IZQUIERDO
    */

    if (visible(puntos[27])) {

        partes.push({

            nombre: "pie izquierdo",

            punto: puntos[27],

            radio: 0.075

        });

    }


    /*
       PIE / TOBILLO DERECHO
    */

    if (visible(puntos[28])) {

        partes.push({

            nombre: "pie derecho",

            punto: puntos[28],

            radio: 0.075

        });

    }


    /*
       PUNTA DEL PIE IZQUIERDO
       MediaPipe 31
    */

    if (visible(puntos[31])) {

        partes.push({

            nombre: "pie izquierdo",

            punto: puntos[31],

            radio: 0.07

        });

    }


    /*
       PUNTA DEL PIE DERECHO
       MediaPipe 32
    */

    if (visible(puntos[32])) {

        partes.push({

            nombre: "pie derecho",

            punto: puntos[32],

            radio: 0.07

        });

    }


    /*
       RODILLA IZQUIERDA
    */

    if (visible(puntos[25])) {

        partes.push({

            nombre: "rodilla izquierda",

            punto: puntos[25],

            radio: 0.075

        });

    }


    /*
       RODILLA DERECHA
    */

    if (visible(puntos[26])) {

        partes.push({

            nombre: "rodilla derecha",

            punto: puntos[26],

            radio: 0.075

        });

    }


    /*
       PECHO

       Calculamos el centro aproximado
       del torso.
    */

    if (
        visible(puntos[11]) &&
        visible(puntos[12]) &&
        visible(puntos[23]) &&
        visible(puntos[24])
    ) {

        const pechoX =
            (
                puntos[11].x +
                puntos[12].x +
                puntos[23].x +
                puntos[24].x
            ) / 4;


        const pechoY =
            (
                puntos[11].y +
                puntos[12].y +
                puntos[23].y +
                puntos[24].y
            ) / 4;


        partes.push({

            nombre: "pecho",

            punto: {

                x: pechoX,

                y: pechoY,

                visibility: 1

            },

            radio: 0.12

        });

    }


    return partes;

}


/* ========================================
   COMPROBAR SI EL BALÓN TOCA EL CUERPO
======================================== */

function comprobarToque() {

    if (!jugando || !pelota.activa) {

        return;

    }


    const partes = obtenerPartes();


    for (const parte of partes) {

        const d = distancia(

            pelota.x,

            pelota.y,

            parte.punto.x,

            parte.punto.y

        );


        /*
           Si balón y cuerpo están cerca
        */

        if (d < parte.radio) {

            hacerToque(parte);

            break;

        }

    }

}


/* ========================================
   TOQUE DEL BALÓN
======================================== */

function hacerToque(parte) {

    const ahora = Date.now();


    /*
       Evitar que un mismo contacto
       cuente muchas veces.
    */

    if (ahora - ultimoToque < 350) {

        return;

    }


    ultimoToque = ahora;


    /*
       SUMAR TOQUE
    */

    contador++;

    contadorTexto.textContent =
        contador;


    /*
       BALÓN HACIA ARRIBA
    */

    pelota.vy = fuerzaToque;


    /*
       Dirección horizontal

       Izquierda → balón ligeramente
       hacia la izquierda.

       Derecha → ligeramente
       hacia la derecha.

       Pecho/rodilla → pequeña variación.
    */

    if (parte.nombre.includes("izquierdo")) {

        pelota.vx = -0.0025;

    }

    else if (parte.nombre.includes("derecho")) {

        pelota.vx = 0.0025;

    }

    else {

        pelota.vx =
            (Math.random() - 0.5) * 0.004;

    }

}


/* ========================================
   ACTUALIZAR BALÓN
======================================== */

function actualizarPelota() {

    if (!pelota.activa) {

        return;

    }


    /*
       GRAVEDAD
    */

    pelota.vy += gravedad;


    /*
       MOVIMIENTO
    */

    pelota.x += pelota.vx;

    pelota.y += pelota.vy;


    /*
       FRENADO HORIZONTAL
    */

    pelota.vx *= 0.995;


    /*
       PAREDES
    */

    if (pelota.x < 0.04) {

        pelota.x = 0.04;

        pelota.vx *= -0.8;

    }


    if (pelota.x > 0.96) {

        pelota.x = 0.96;

        pelota.vx *= -0.8;

    }


    /*
       SI EL BALÓN SE VA POR ABAJO

       Lo devolvemos arriba para
       que puedas seguir jugando.
    */

    if (pelota.y > 1.05) {

        pelota.y = 0.30;

        pelota.vy = 0.002;

        pelota.vx =
            (Math.random() - 0.5) * 0.003;

    }


    /*
       COMPROBAR CONTACTO
    */

    comprobarToque();


    /*
       TAMAÑO DE LA ZONA
    */

    const ancho =
        zona.clientWidth;

    const alto =
        zona.clientHeight;


    /*
       POSICIÓN DEL BALÓN
    */

    const x =
        pelota.x * ancho;

    const y =
        pelota.y * alto;


    balon.style.left =
        (x - pelota.radio) + "px";


    balon.style.top =
        (y - pelota.radio) + "px";

}


/* ========================================
   BUCLE PRINCIPAL
======================================== */

function bucle() {

    actualizarPelota();

    requestAnimationFrame(bucle);

}


bucle();

</script>

</body>
</html>
