<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>⚽ Fútbol Toques</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

body {
  overflow-x: hidden;
}

h1 {
  margin: 10px 0 3px;
  font-size: 28px;
}

#estado {
  color: #ccc;
  min-height: 22px;
}

#contador {
  font-size: 65px;
  font-weight: bold;
  line-height: 1;
  margin: 5px 0 10px;
}


/* =========================
   CÁMARA
========================= */

#zonaCamara {
  position: relative;
  width: 96vw;
  max-width: 1000px;
  margin: auto;

  /*
     Más alta para facilitar
     que entre el cuerpo completo.
  */
  aspect-ratio: 9 / 16;

  background: black;
  overflow: hidden;
  border-radius: 16px;
}

#video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: black;
}


/* =========================
   BALÓN
========================= */

#balon {
  position: absolute;

  width: 58px;
  height: 58px;

  margin-left: -29px;
  margin-top: -29px;

  display: none;

  z-index: 20;

  pointer-events: none;

  font-size: 50px;
  line-height: 58px;

  filter:
    drop-shadow(
      0 4px 5px rgba(0,0,0,.7)
    );
}


/* =========================
   BOTONES
========================= */

.controles {
  width: 96%;
  max-width: 1000px;

  margin: 12px auto;

  display: flex;
  justify-content: center;
  flex-wrap: wrap;

  gap: 8px;
}

button {
  border: none;
  border-radius: 12px;

  padding: 12px 16px;

  font-size: 16px;
  font-weight: bold;

  color: white;

  cursor: pointer;

  touch-action: manipulation;
}

button:disabled {
  opacity: .4;
}

#activar {
  background: #00a83b;
}

#empezar {
  background: #1976d2;
}

#reiniciar {
  background: #d32f2f;
}

#cambiarCamara {
  background: #6a1b9a;
}

#calibrar {
  background: #ef6c00;
}


/* =========================
   ZOOM
========================= */

#zoomBox {
  width: 94%;
  max-width: 500px;

  margin: 8px auto 14px;

  padding: 9px 12px;

  background: #222;

  border-radius: 12px;
}

#zoom {
  width: 100%;
}


/* =========================
   INFORMACIÓN
========================= */

#info {
  width: 94%;
  max-width: 1000px;

  margin: 10px auto 25px;

  padding: 12px;

  border-radius: 14px;

  background: #202020;

  text-align: left;
}

.fila {
  display: flex;
  justify-content: space-between;

  padding: 5px;

  border-bottom: 1px solid #333;
}

.ok {
  color: #5cff78;
}

.no {
  color: #aaa;
}

#ayuda {
  width: 94%;
  max-width: 700px;

  margin: 0 auto 25px;

  color: #aaa;

  font-size: 13px;

  line-height: 1.4;
}

</style>
</head>


<body>

<h1>⚽ Fútbol Toques</h1>

<div id="estado">
  Pulsa «Activar cámara»
</div>

<div id="contador">
  0
</div>


<div id="zonaCamara">

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <div id="balon">
    ⚽
  </div>

</div>


<div class="controles">

  <button id="activar">
    📷 Activar cámara
  </button>

  <button
    id="empezar"
    disabled
  >
    ▶️ Empezar
  </button>

  <button id="reiniciar">
    🔄 Reiniciar
  </button>

  <button
    id="cambiarCamara"
    disabled
  >
    🔁 Cámara
  </button>

  <button
    id="calibrar"
    disabled
  >
    🎯 Recalibrar
  </button>

</div>


<div id="zoomBox">

  🔍 Zoom

  <input
    id="zoom"
    type="range"
    min="0.5"
    max="3"
    step="0.1"
    value="0.5"
    disabled
  >

</div>


<div id="info">

  <div class="fila">
    <span>🦵 Rodilla izquierda</span>
    <span
      id="rodillaI"
      class="no"
    >—</span>
  </div>

  <div class="fila">
    <span>🦵 Rodilla derecha</span>
    <span
      id="rodillaD"
      class="no"
    >—</span>
  </div>

  <div class="fila">
    <span>🦶 Pie izquierdo</span>
    <span
      id="pieI"
      class="no"
    >—</span>
  </div>

  <div class="fila">
    <span>🦶 Pie derecho</span>
    <span
      id="pieD"
      class="no"
    >—</span>
  </div>

  <div class="fila">
    <span>🫁 Pecho</span>
    <span
      id="pecho"
      class="no"
    >—</span>
  </div>

</div>


<div id="ayuda">

  Colócate a una distancia suficiente para que
  se vea todo tu cuerpo. La aplicación utiliza
  hitboxes moderadas para detectar los contactos.

</div>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const video =
  document.getElementById("video");

const zonaCamara =
  document.getElementById("zonaCamara");

const balon =
  document.getElementById("balon");

const estado =
  document.getElementById("estado");

const contadorTexto =
  document.getElementById("contador");

const activar =
  document.getElementById("activar");

const empezar =
  document.getElementById("empezar");

const reiniciar =
  document.getElementById("reiniciar");

const cambiarCamara =
  document.getElementById("cambiarCamara");

const calibrar =
  document.getElementById("calibrar");

const zoom =
  document.getElementById("zoom");


/* =====================================================
   ESTADO
===================================================== */

let stream = null;

let trackVideo = null;

let capacidadesVideo = null;

let detector = null;

let puntos = [];

let jugando = false;

let contador = 0;

let camaraTrasera = false;

let animacionDeteccion = null;


/*
   Factor de tamaño del cuerpo.
*/

let escalaCuerpo = 1;


/* =====================================================
   HISTORIAL
===================================================== */

const historial = {};

const FACTOR_POSICION = 0.50;

const FACTOR_VELOCIDAD = 0.45;


function obtenerPosicion(
  nombre,
  x,
  y
) {

  if (!historial[nombre]) {

    historial[nombre] = {

      x,
      y,

      vx: 0,
      vy: 0

    };

    return historial[nombre];

  }


  const h =
    historial[nombre];


  const vx =
    x - h.x;

  const vy =
    y - h.y;


  h.vx =
    h.vx *
    (1 - FACTOR_VELOCIDAD)
    +
    vx *
    FACTOR_VELOCIDAD;


  h.vy =
    h.vy *
    (1 - FACTOR_VELOCIDAD)
    +
    vy *
    FACTOR_VELOCIDAD;


  h.x +=
    (x - h.x) *
    FACTOR_POSICION;


  h.y +=
    (y - h.y) *
    FACTOR_POSICION;


  return h;

}


/* =====================================================
   CARGAR MOVENET
===================================================== */

async function cargarModelo() {

  estado.textContent =
    "🧠 Cargando MoveNet...";


  await tf.ready();


  try {

    await tf.setBackend("webgl");

    await tf.ready();

  } catch (e) {

    console.log(
      "WebGL no disponible"
    );

  }


  detector =
    await poseDetection.createDetector(

      poseDetection.SupportedModels.MoveNet,

      {

        modelType:
          poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,

        enableSmoothing: true

      }

    );


  estado.textContent =
    "🧠 MoveNet preparado";

}


/* =====================================================
   CÁMARA
===================================================== */

async function iniciarCamara() {

  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  const facingMode =
    camaraTrasera
      ? "environment"
      : "user";


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: facingMode
          },

          /*
             Pedimos una imagen
             de alta resolución.
          */

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    trackVideo =
      stream.getVideoTracks()[0];


    capacidadesVideo =
      trackVideo.getCapabilities();


    activar.disabled =
      true;

    empezar.disabled =
      false;

    cambiarCamara.disabled =
      false;

    calibrar.disabled =
      false;

    zoom.disabled =
      false;


    configurarZoom();


    if (!detector) {

      await cargarModelo();

    }


    comenzarDeteccion();


    actualizarEspejo();


    estado.textContent =
      "📷 Cámara activa";

  }

  catch (error) {

    console.error(error);

    estado.textContent =
      "❌ No se pudo abrir la cámara";

    alert(
      "No se pudo acceder a la cámara. Comprueba los permisos."
    );

  }

}


/* =====================================================
   ZOOM
===================================================== */

function configurarZoom() {

  /*
     Ponemos 0.5 como valor visual
     inicial.

     Si el móvil no permite 0.5 real,
     utilizaremos un zoom visual.
  */

  zoom.value =
    "0.5";


  if (
    capacidadesVideo &&
    capacidadesVideo.zoom
  ) {

    zoom.min =
      Math.max(
        0.5,
        capacidadesVideo.zoom.min
      );


    zoom.max =
      capacidadesVideo.zoom.max;


    zoom.step =
      capacidadesVideo.zoom.step ||
      0.1;


    /*
       Intentamos empezar en 0.5.
    */

    if (
      0.5 >=
      capacidadesVideo.zoom.min &&
      0.5 <=
      capacidadesVideo.zoom.max
    ) {

      zoom.value =
        "0.5";

    }

  }

}


/* =====================================================
   APLICAR ZOOM
===================================================== */

zoom.addEventListener(
  "input",
  async () => {

    const valor =
      Number(zoom.value);


    /*
       Zoom real de la cámara.
    */

    if (
      trackVideo &&
      capacidadesVideo &&
      capacidadesVideo.zoom
    ) {

      try {

        await trackVideo.applyConstraints({

          advanced: [

            {
              zoom: valor
            }

          ]

        });


        actualizarEspejo();

        return;

      }

      catch (e) {

        console.log(
          "Zoom real no disponible"
        );

      }

    }


    /*
       Alternativa visual.

       0.5 significa que queremos
       un campo de visión muy abierto.

       Como CSS scale no permite
       reducir el campo de visión
       real, usamos un ajuste
       conservador.
    */

    const escalaVisual =
      Math.max(
        1,
        valor
      );


    if (camaraTrasera) {

      video.style.transform =
        `scale(${escalaVisual})`;

    }

    else {

      video.style.transform =
        `scaleX(-1) scale(${escalaVisual})`;

    }

  }
);


/* =====================================================
   ESPEJO
===================================================== */

function actualizarEspejo() {

  /*
     Frontal:
     espejo.

     Trasera:
     normal.
  */

  const valor =
    Number(zoom.value);


  if (camaraTrasera) {

    if (
      capacidadesVideo &&
      capacidadesVideo.zoom
    ) {

      video.style.transform =
        "none";

    }

    else {

      video.style.transform =
        `scale(${Math.max(1, valor)})`;

    }

  }

  else {

    if (
      capacidadesVideo &&
      capacidadesVideo.zoom
    ) {

      video.style.transform =
        "scaleX(-1)";

    }

    else {

      video.style.transform =
        `scaleX(-1) scale(${Math.max(1, valor)})`;

    }

  }

}


/* =====================================================
   ACTIVAR CÁMARA
===================================================== */

activar.onclick =
  async () => {

    await iniciarCamara();

  };


/* =====================================================
   CAMBIAR CÁMARA
===================================================== */

cambiarCamara.onclick =
  async () => {

    camaraTrasera =
      !camaraTrasera;


    estado.textContent =
      "📷 Cambiando cámara...";


    await iniciarCamara();

  };


/* =====================================================
   DETECCIÓN
===================================================== */

function comenzarDeteccion() {

  if (animacionDeteccion) {

    cancelAnimationFrame(
      animacionDeteccion
    );

  }


  async function detectar() {

    if (
      !detector ||
      video.readyState < 2
    ) {

      animacionDeteccion =
        requestAnimationFrame(
          detectar
        );

      return;

    }


    try {

      const poses =
        await detector.estimatePoses(

          video,

          {

            maxPoses: 1,

            flipHorizontal: false

          }

        );


      if (
        poses &&
        poses.length
      ) {

        puntos =
          poses[0].keypoints || [];


        procesarPose();

      }

      else {

        puntos = [];

        estado.textContent =
          "👤 No detecto el cuerpo";

      }

    }

    catch (error) {

      console.error(error);

    }


    animacionDeteccion =
      requestAnimationFrame(
        detectar
      );

  }


  detectar();

}


/* =====================================================
   OBTENER PUNTO
===================================================== */

function obtenerPunto(indice) {

  const p =
    puntos[indice];


  if (!p) {

    return null;

  }


  /*
     Umbral bajo para intentar
     mantener pies y tobillos.
  */

  if (
    p.score !== undefined &&
    p.score < 0.20
  ) {

    return null;

  }


  if (
    p.x === undefined ||
    p.y === undefined
  ) {

    return null;

  }


  return obtenerPosicion(

    "p" + indice,

    p.x /
      video.videoWidth,

    p.y /
      video.videoHeight

  );

}


/* =====================================================
   PROCESAR CUERPO
===================================================== */

function procesarPose() {

  actualizarTexto(
    "rodillaI",
    obtenerPunto(13)
  );


  actualizarTexto(
    "rodillaD",
    obtenerPunto(14)
  );


  actualizarTexto(
    "pieI",
    obtenerPunto(15) ||
    obtenerPunto(21) ||
    obtenerPunto(19)
  );


  actualizarTexto(
    "pieD",
    obtenerPunto(16) ||
    obtenerPunto(22) ||
    obtenerPunto(20)
  );


  const hombroI =
    obtenerPunto(5);


  const hombroD =
    obtenerPunto(6);


  const caderaI =
    obtenerPunto(11);


  const caderaD =
    obtenerPunto(12);


  let pecho = null;


  if (
    hombroI &&
    hombroD &&
    caderaI &&
    caderaD
  ) {

    pecho = {

      x:
        (
          hombroI.x +
          hombroD.x +
          caderaI.x +
          caderaD.x
        ) / 4,

      y:
        (
          hombroI.y +
          hombroD.y +
          caderaI.y +
          caderaD.y
        ) / 4

    };

  }


  actualizarTexto(
    "pecho",
    pecho
  );

}


/* =====================================================
   TEXTO
===================================================== */

function actualizarTexto(
  id,
  punto
) {

  const elemento =
    document.getElementById(id);


  if (punto) {

    elemento.textContent =
      "✓";

    elemento.className =
      "ok";

  }

  else {

    elemento.textContent =
      "—";

    elemento.className =
      "no";

  }

}


/* =====================================================
   PELOTA
===================================================== */

const pelota = {

  x: 0.50,

  y: 0.12,

  vx: 0,

  vy: 0,

  radio: 0.032,

  activa: false,

  ultimoToque: 0,

  ultimoTipo: ""

};


/*
   Gravedad normalizada.
*/

const GRAVEDAD =
  0.00072;


/*
   MUCHO MÁS IMPULSO
   hacia arriba.
*/

const IMPULSO_BASE =
  0.030;


/*
   Máximo.
*/

const IMPULSO_MAXIMO =
  0.042;


/*
   0.7 segundos sin poder
   contar otro toque.
*/

const BLOQUEO_TOQUE =
  700;


/* =====================================================
   HITBOX DEL PIE
===================================================== */

function crearPie(
  nombre,
  tobillo,
  talon,
  punta
) {

  const puntosPie = [];


  if (tobillo)
    puntosPie.push(tobillo);


  if (talon)
    puntosPie.push(talon);


  if (punta)
    puntosPie.push(punta);


  if (
    puntosPie.length === 0
  ) {

    return null;

  }


  /*
     Hitbox moderada.

     Antes era ~0.095.

     Ahora es ~0.060.
    */

  const radio =
    0.060 *
    escalaCuerpo;


  return {

    nombre,

    puntos: puntosPie,

    radio

  };

}


/* =====================================================
   HITBOXES
===================================================== */

function obtenerHitboxes() {

  const resultado = [];


  /* -----------------------
     PIE IZQUIERDO
  ----------------------- */

  const pieI =
    crearPie(

      "pie izquierdo",

      obtenerPunto(15),

      obtenerPunto(21),

      obtenerPunto(19)

    );


  if (pieI)
    resultado.push(pieI);


  /* -----------------------
     PIE DERECHO
  ----------------------- */

  const pieD =
    crearPie(

      "pie derecho",

      obtenerPunto(16),

      obtenerPunto(22),

      obtenerPunto(20)

    );


  if (pieD)
    resultado.push(pieD);


  /* -----------------------
     RODILLA IZQUIERDA
  ----------------------- */

  const rodillaI =
    obtenerPunto(13);


  if (rodillaI) {

    resultado.push({

      nombre:
        "rodilla izquierda",

      puntos:
        [rodillaI],

      radio:
        0.070 *
        escalaCuerpo

    });

  }


  /* -----------------------
     RODILLA DERECHA
  ----------------------- */

  const rodillaD =
    obtenerPunto(14);


  if (rodillaD) {

    resultado.push({

      nombre:
        "rodilla derecha",

      puntos:
        [rodillaD],

      radio:
        0.070 *
        escalaCuerpo

    });

  }


  /* -----------------------
     PECHO
  ----------------------- */

  const hombroI =
    obtenerPunto(5);


  const hombroD =
    obtenerPunto(6);


  const caderaI =
    obtenerPunto(11);


  const caderaD =
    obtenerPunto(12);


  if (
    hombroI &&
    hombroD &&
    caderaI &&
    caderaD
  ) {

    const pecho = {

      x:
        (
          hombroI.x +
          hombroD.x +
          caderaI.x +
          caderaD.x
        ) / 4,

      y:
        (
          hombroI.y +
          hombroD.y +
          caderaI.y +
          caderaD.y
        ) / 4

    };


    resultado.push({

      nombre:
        "pecho",

      puntos:
        [pecho],

      radio:
        0.115 *
        escalaCuerpo

    });

  }


  return resultado;

}


/* =====================================================
   DISTANCIA
===================================================== */

function distancia(
  a,
  b
) {

  const dx =
    a.x - b.x;


  const dy =
    a.y - b.y;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =====================================================
   VELOCIDAD
===================================================== */

function velocidadDe(
  punto
) {

  if (!punto)
    return {
      x: 0,
      y: 0
    };


  let mejor = null;

  let distanciaMinima =
    Infinity;


  for (
    const clave in historial
  ) {

    const h =
      historial[clave];


    const d =
      Math.abs(
        h.x - punto.x
      ) +
      Math.abs(
        h.y - punto.y
      );


    if (
      d < distanciaMinima
    ) {

      distanciaMinima =
        d;

      mejor =
        h;

    }

  }


  if (!mejor) {

    return {
      x: 0,
      y: 0
    };

  }


  return {

    x: mejor.vx,

    y: mejor.vy

  };

}


/* =====================================================
   COMPROBAR CONTACTO
===================================================== */

function comprobarContacto() {

  if (
    !jugando ||
    !pelota.activa
  ) {

    return;

  }


  const ahora =
    performance.now();


  /*
     BLOQUEO DE 700 MS.

     Durante este tiempo
     NO se comprueba ningún
     nuevo toque.
  */

  if (
    ahora -
    pelota.ultimoToque
    <
    BLOQUEO_TOQUE
  ) {

    return;

  }


  const hitboxes =
    obtenerHitboxes();


  /*
     Hitbox moderada del balón.
  */

  const radioBalon =
    pelota.radio *
    1.12;


  for (
    const hitbox
    of hitboxes
  ) {

    for (
      const punto
      of hitbox.puntos
    ) {

      if (
        distancia(
          pelota,
          punto
        )
        <
        hitbox.radio +
        radioBalon
      ) {

        realizarToque(
          hitbox.nombre,
          punto
        );


        return;

      }

    }

  }

}


/* =====================================================
   REALIZAR TOQUE
===================================================== */

function realizarToque(
  tipo,
  punto
) {

  const ahora =
    performance.now();


  /*
     SEGURIDAD EXTRA
  */

  if (
    ahora -
    pelota.ultimoToque
    <
    BLOQUEO_TOQUE
  ) {

    return;

  }


  /*
     Guardar momento.
  */

  pelota.ultimoToque =
    ahora;


  pelota.ultimoTipo =
    tipo;


  /*
     SUMAR
  */

  contador++;

  contadorTexto.textContent =
    contador;


  /*
     VELOCIDAD DEL CUERPO
  */

  const velocidad =
    velocidadDe(
      punto
    );


  /*
     Fuerza base muy alta.
  */

  let impulso =
    IMPULSO_BASE;


  /*
     Movimiento hacia arriba
     aumenta un poco la fuerza.
  */

  if (
    velocidad.y < 0
  ) {

    impulso +=
      Math.abs(
        velocidad.y
      ) *
      0.8;

  }


  /*
     Limitar.
  */

  impulso =
    Math.max(
      IMPULSO_BASE,
      Math.min(
        IMPULSO_MAXIMO,
        impulso
      )
    );


  /*
     El pie puede pegar
     un poco más fuerte.
  */

  if (
    tipo.includes("pie")
  ) {

    impulso *=
      1.08;

  }


  /*
     La rodilla un poco menos.
  */

  if (
    tipo.includes("rodilla")
  ) {

    impulso *=
      0.95;

  }


  /*
     El pecho amortigua.
  */

  if (
    tipo === "pecho"
  ) {

    impulso *=
      0.72;

  }


  /*
     VELOCIDAD HORIZONTAL

     Aprovechamos el movimiento
     lateral de la pierna.
  */

  let horizontal =
    velocidad.x *
    0.65;


  /*
     Pequeño efecto según
     el lado.
  */

  if (
    tipo.includes("izquierdo")
  ) {

    horizontal -=
      0.001;

  }


  if (
    tipo.includes("derecho")
  ) {

    horizontal +=
      0.001;

  }


  horizontal =
    Math.max(
      -0.010,
      Math.min(
        0.010,
        horizontal
      )
    );


  /*
     FÍSICA
  */

  pelota.vy =
    -impulso;


  pelota.vx =
    horizontal;


  /*
     Colocamos la pelota
     justo encima del contacto.
  */

  pelota.x =
    Math.max(
      0.04,
      Math.min(
        0.96,
        punto.x
      )
    );


  pelota.y =
    Math.max(
      0.04,
      punto.y -
      0.035
    );

}


/* =====================================================
   FÍSICA
===================================================== */

let ultimoFrame =
  performance.now();


function actualizarPelota(
  tiempo
) {

  if (
    !pelota.activa
  ) {

    ultimoFrame =
      tiempo;

    return;

  }


  let delta =
    tiempo -
    ultimoFrame;


  ultimoFrame =
    tiempo;


  delta =
    Math.min(
      delta,
      40
    );


  const factor =
    delta /
    16.67;


  /*
     GRAVEDAD
  */

  pelota.vy +=
    GRAVEDAD *
    factor;


  /*
     MOVIMIENTO
  */

  pelota.x +=
    pelota.vx *
    factor;


  pelota.y +=
    pelota.vy *
    factor;


  /*
     AIRE
  */

  pelota.vx *=
    Math.pow(
      0.994,
      factor
    );


  /*
     PARED IZQUIERDA
  */

  if (
    pelota.x <
    0.035
  ) {

    pelota.x =
      0.035;


    pelota.vx =
      Math.abs(
        pelota.vx
      ) *
      0.8;

  }


  /*
     PARED DERECHA
  */

  if (
    pelota.x >
    0.965
  ) {

    pelota.x =
      0.965;


    pelota.vx =
      -Math.abs(
        pelota.vx
      ) *
      0.8;

  }


  /*
     SI CAE

     La pelota vuelve arriba.
  */

  if (
    pelota.y >
    1.08
  ) {

    pelota.x =
      0.45 +
      Math.random() *
      0.10;


    pelota.y =
      0.10;


    pelota.vx =
      0;


    pelota.vy =
      0.003;

  }


  /*
     CONTACTO
  */

  comprobarContacto();


  /*
     DIBUJAR
  */

  const ancho =
    zonaCamara.clientWidth;


  const alto =
    zonaCamara.clientHeight;


  balon.style.left =
    (
      pelota.x *
      ancho
    ) + "px";


  balon.style.top =
    (
      pelota.y *
      alto
    ) + "px";

}


/* =====================================================
   BUCLE
===================================================== */

function bucleFisica(
  tiempo
) {

  actualizarPelota(
    tiempo
  );


  requestAnimationFrame(
    bucleFisica
  );

}


requestAnimationFrame(
  bucleFisica
);

/* =====================================================
   RECALIBRAR
===================================================== */

calibrar.onclick =
  () => {

    const cabeza =
      obtenerPunto(0);


    const pieI =
      obtenerPunto(19);


    const pieD =
      obtenerPunto(20);


    if (
      cabeza &&
      (pieI || pieD)
    ) {

      const pie =
        pieI &&
        pieD
          ? (
              pieI.y >
              pieD.y
              ? pieI
              : pieD
            )
          : (
              pieI ||
              pieD
            );


      const altura =
        Math.abs(
          pie.y -
          cabeza.y
        );


      escalaCuerpo =
        Math.max(
          0.8,
          Math.min(
            1.35,
            altura / 0.75
          )
        );


      estado.textContent =
        "🎯 Cuerpo recalibrado";

    }

    else {

      estado.textContent =
        "⚠️ Ponte completamente visible";

    }

  };
