</head>


<body>


<h1>

</h1>


<div id="estado">

    </span>

  </div>


  <div class="fila">

    </span>

    <span
      id="pieI"
      class="no"
    >
      —
    </span>

  </div>


  <div class="fila">

    <span>

    </span>

    <span
      id="pieD"

    </span>

  Coloca el móvil suficientemente lejos para

<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const video =
  document.getElementById(
    "video"
  );


const zonaCamara =
  document.getElementById(
    "zonaCamara"
  );


const balon =
  document.getElementById(
    "balon"
  );


const estado =
  document.getElementById(
    "estado"
  );


const contadorTexto =
  document.getElementById(
    "contador"
  );


const activar =
  document.getElementById(
    "activar"
  );


const empezar =
  document.getElementById(
    "empezar"
  );


const reiniciar =
  document.getElementById(
    "reiniciar"
  );


const cambiarCamara =
  document.getElementById(
    "cambiarCamara"
  );


const calibrar =
  document.getElementById(
    "calibrar"
  );


const zoom =
  document.getElementById(
    "zoom"
  );


/* =====================================================
   ESTADO GENERAL
===================================================== */

let stream = null;

let trackVideo = null;

let capacidadesVideo = null;

let detector = null;

let puntos = [];

let jugando = false;

let contador = 0;

let camaraTrasera = true;

let rafDeteccion = null;


/*
   Tamaño estimado del cuerpo.

   Se utiliza solamente para adaptar
   ligeramente las hitboxes.
*/

let escalaCuerpo = 1;


/* =====================================================
   MOVIMIENTO
===================================================== */

/*
   Historial de puntos.

   MoveNet puede producir pequeños
   movimientos aunque estés quieto.

   El suavizado reduce esos temblores.
*/

const historial = {};


const SUAVIZADO_POSICION =
  0.55;


const SUAVIZADO_VELOCIDAD =
  0.35;


function puntoSuavizado(
  nombre,
  x,
  y
) {

  if (!historial[nombre]) {

    historial[nombre] = {

      x: x,
      y: y,

      vx: 0,
      vy: 0

    };

    return historial[nombre];

  }


  const h =
    historial[nombre];


  const movimientoX =
    x - h.x;


  const movimientoY =
    y - h.y;


  h.vx =
    h.vx *
    (1 - SUAVIZADO_VELOCIDAD)
    +
    movimientoX *
    SUAVIZADO_VELOCIDAD;


  h.vy =
    h.vy *
    (1 - SUAVIZADO_VELOCIDAD)
    +
    movimientoY *
    SUAVIZADO_VELOCIDAD;


  h.x +=
    movimientoX *
    SUAVIZADO_POSICION;


  h.y +=
    movimientoY *
    SUAVIZADO_POSICION;


  return h;

}


/* =====================================================
   MOVENET
===================================================== */

async function cargarModelo() {

  estado.textContent =
    "🧠 Preparando detector...";


  await tf.ready();


  /*
     WebGL suele ser más rápido
     en móviles compatibles.
  */

  try {

    await tf.setBackend(
      "webgl"
    );

    await tf.ready();

  }

  catch (error) {

    console.log(
      "WebGL no disponible"
    );

  }


  detector =
    await poseDetection.createDetector(

      poseDetection.SupportedModels.MoveNet,

      {

        modelType:
          poseDetection
            .movenet
            .modelType
            .SINGLEPOSE_THUNDER,

        enableSmoothing:
          true

      }

    );


  estado.textContent =
    "🧠 Detector listo";

}


/* =====================================================
   CÁMARA
===================================================== */

async function iniciarCamara() {

  /*
     Cerrar cámara anterior.
  */

  if (stream) {

    stream
      .getTracks()
      .forEach(
        t =>
          t.stop()
      );

  }


  const facing =
    camaraTrasera
      ? "environment"
      : "user";


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {

              ideal:
                facing

            },

            /*
               Pedimos resolución alta,
               pero sin exigirla.
            */

            width: {

              ideal:
                1920

            },

            height: {

              ideal:
                1080

            },

            frameRate: {

              ideal: 30,

              max: 30

            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    trackVideo =
      stream
        .getVideoTracks()[0];


    capacidadesVideo =
      trackVideo
        .getCapabilities();


    activar.disabled =
      true;


    empezar.disabled =
      false;


    cambiarCamara.disabled =
      false;


    calibrar.disabled =
      false;


    zoom.disabled =
      false;


    configurarZoom();


    if (!detector) {

      await cargarModelo();

    }


    actualizarEspejo();


    comenzarDeteccion();


    estado.textContent =
      "📷 Cámara lista";


  }

  catch (error) {

    console.error(error);


    estado.textContent =
      "❌ Error con la cámara";


    alert(
      "No se pudo acceder a la cámara. Revisa los permisos del navegador."
    );

  }

}


/* =====================================================
   ZOOM
===================================================== */

function configurarZoom() {

  /*
     Intentar zoom 0.5x.

     Algunos móviles no permiten
     zoom inferior a 1.
  */

  zoom.value =
    "0.5";


  if (
    capacidadesVideo &&
    capacidadesVideo.zoom
  ) {

    zoom.min =
      Math.max(
        0.5,
        capacidadesVideo.zoom.min
      );


    zoom.max =
      capacidadesVideo.zoom.max;


    zoom.step =
      capacidadesVideo.zoom.step ||
      0.1;


    /*
       Intentar 0.5.
    */

    if (
      0.5 >=
      capacidadesVideo.zoom.min &&
      0.5 <=
      capacidadesVideo.zoom.max
    ) {

      zoom.value =
        "0.5";

    }

  }

}


/* =====================================================
   APLICAR ZOOM
===================================================== */

zoom.addEventListener(
  "input",
  async () => {

    const valor =
      Number(
        zoom.value
      );


    /*
       Zoom REAL del móvil.
    */

    if (
      trackVideo &&
      capacidadesVideo &&
      capacidadesVideo.zoom
    ) {

      try {

        await trackVideo
          .applyConstraints({

            advanced: [

              {
                zoom:
                  valor
              }

            ]

          });


        return;

      }

      catch (e) {

        console.log(
          "No se pudo aplicar zoom real"
        );

      }

    }


    /*
       Si el móvil no tiene
       control de zoom desde
       el navegador, evitamos
       ampliar demasiado.

       El objetivo principal es
       mantener el cuerpo entero.
    */

    const escala =
      Math.max(
        1,
        valor
      );


    if (camaraTrasera) {

      video.style.transform =
        `scale(${escala})`;

    }

    else {

      video.style.transform =
        `scaleX(-1) scale(${escala})`;

    }

  }
);


/* =====================================================
   ESPEJO
===================================================== */

function actualizarEspejo() {

  if (camaraTrasera) {

    video.style.transform =
      "none";

  }

  else {

    video.style.transform =
      "scaleX(-1)";

  }

}


/* =====================================================
   ACTIVAR
===================================================== */

activar.onclick =
  async () => {

    await iniciarCamara();

  };


/* =====================================================
   CAMBIAR CÁMARA
===================================================== */

cambiarCamara.onclick =
  async () => {

    camaraTrasera =
      !camaraTrasera;


    estado.textContent =
      "📷 Cambiando cámara...";


    await iniciarCamara();

  };


/* =====================================================
   DETECCIÓN
===================================================== */

function comenzarDeteccion() {

  if (rafDeteccion) {

    cancelAnimationFrame(
      rafDeteccion
    );

  }


  async function detectar() {

    if (
      !detector ||
      video.readyState < 2
    ) {

      rafDeteccion =
        requestAnimationFrame(
          detectar
        );

      return;

    }


    try {

      const poses =
        await detector
          .estimatePoses(

            video,

            {

              maxPoses: 1,

              flipHorizontal:
                false

            }

          );


      if (
        poses &&
        poses.length > 0
      ) {

        puntos =
          poses[0]
            .keypoints ||
          [];


        actualizarCuerpo();

      }

      else {

        puntos = [];

        estado.textContent =
          "👤 Buscando cuerpo...";

      }

    }

    catch (error) {

      console.log(error);

    }


    rafDeteccion =
      requestAnimationFrame(
        detectar
      );

  }


  detectar();

}


/* =====================================================
   OBTENER PUNTO
===================================================== */

function obtenerPunto(
  indice
) {

  const p =
    puntos[indice];


  if (!p)
    return null;


  /*
     Umbral suficientemente bajo
     para no perder las piernas.
  */

  if (
    p.score !== undefined &&
    p.score < 0.18
  ) {

    return null;

  }


  if (
    p.x === undefined ||
    p.y === undefined
  ) {

    return null;

  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return null;

  }


  return puntoSuavizado(

    "p" + indice,

    p.x /
      video.videoWidth,

    p.y /
      video.videoHeight

  );

}


/* =====================================================
   ACTUALIZAR CUERPO
===================================================== */

function actualizarCuerpo() {

  const rodillaI =
    obtenerPunto(13);


  const rodillaD =
    obtenerPunto(14);


  const tobilloI =
    obtenerPunto(15);


  const tobilloD =
    obtenerPunto(16);


  actualizarTexto(
    "rodillaI",
    rodillaI
  );


  actualizarTexto(
    "rodillaD",
    rodillaD
  );


  actualizarTexto(
    "pieI",
    tobilloI
  );


  actualizarTexto(
    "pieD",
    tobilloD
  );


  const hombroI =
    obtenerPunto(5);


  const hombroD =
    obtenerPunto(6);


  const caderaI =
    obtenerPunto(11);


  const caderaD =
    obtenerPunto(12);


  if (
    hombroI &&
    hombroD &&
    caderaI &&
    caderaD
  ) {

    const pecho = {

      x:
        (
          hombroI.x +
          hombroD.x +
          caderaI.x +
          caderaD.x
        ) / 4,

      y:
        (
          hombroI.y +
          hombroD.y +
          caderaI.y +
          caderaD.y
        ) / 4

    };


    actualizarTexto(
      "pecho",
      pecho
    );

  }

  else {

    actualizarTexto(
      "pecho",
      null
    );

  }

}


/* =====================================================
   TEXTO
===================================================== */

function actualizarTexto(
  id,
  punto
) {

  const elemento =
    document.getElementById(id);


  if (punto) {

    elemento.textContent =
      "✓";

    elemento.className =
      "ok";

  }

  else {

    elemento.textContent =
      "—";

    elemento.className =
      "no";

  }

}


/* =====================================================
   CALIBRACIÓN
===================================================== */

function recalibrar() {

  const cabeza =
    obtenerPunto(0);


  const rodillaI =
    obtenerPunto(13);


  const rodillaD =
    obtenerPunto(14);


  const tobilloI =
    obtenerPunto(15);


  const tobilloD =
    obtenerPunto(16);


  /*
     Para calibrar necesitamos
     al menos una pierna.
  */

  if (
    !cabeza ||
    (!tobilloI && !tobilloD)
  ) {

    estado.textContent =
      "⚠️ Necesito verte entero";

    return;

  }


  const tobillo =
    tobilloI &&
    tobilloD

      ? (
          tobilloI.y >
          tobilloD.y

          ? tobilloI
          : tobilloD
        )

      : (
          tobilloI ||
          tobilloD
        );


  const altura =
    Math.abs(
      tobillo.y -
      cabeza.y
    );


  /*
     Factor moderado.

     Nunca hacemos hitboxes enormes.
  */

  escalaCuerpo =
    Math.max(
      0.80,
      Math.min(
        1.20,
        altura / 0.80
      )
    );


  estado.textContent =
    "🎯 Calibración realizada";

}


/* =====================================================
   PELOTA
===================================================== */

const pelota = {

  x: 0.50,

  y: 0.15,

  anteriorX: 0.50,

  anteriorY: 0.15,

  vx: 0,

  vy: 0,

  radio: 0.030,

  activa: false,

  ultimoToque: -10000,

  ultimoTipo: ""

};


/* =====================================================
   FÍSICA
===================================================== */


/*
   Gravedad reducida.

   Hace que el balón tenga una
   trayectoria más cómoda.
*/

const GRAVEDAD =
  0.00058;


/*
   Toque alto.

   El balón sube bastante.
*/

const IMPULSO_BASE =
  0.023;


/*
   Máximo para evitar
   velocidades absurdas.
*/

const IMPULSO_MAX =
  0.030;


/*
   700 ms exactos.
*/

const TIEMPO_BLOQUEO =
  700;


/*
   Rebote lateral suave.
*/

const REBOTE_PARED =
  0.72;


/* =====================================================
   HITBOX DE RODILLA
===================================================== */

function hitboxRodilla(
  punto,
  nombre
) {

  if (!punto)
    return null;


  return {

    tipo:
      nombre,

    x:
      punto.x,

    y:
      punto.y,

    /*
       Bastante pequeña.

       Esto evita los falsos
       contactos que tenías antes.
    */

    radio:
      0.045 *
      escalaCuerpo

  };

}


/* =====================================================
   HITBOX DE PIE
===================================================== */

function hitboxPie(
  tobillo,
  nombre
) {

  if (!tobillo)
    return null;


  /*
     MoveNet nos da el tobillo,
     pero no una punta de pie
     fiable en estos índices.

     Por eso creamos una pequeña
     zona justo por debajo del tobillo.
  */

  return {

    tipo:
      nombre,

    x:
      tobillo.x,

    y:
      tobillo.y +
      0.020,

    /*
       Algo mayor que la rodilla,
       pero todavía moderada.
    */

    radio:
      0.055 *
      escalaCuerpo

  };

}


/* =====================================================
   PECHO
===================================================== */

function hitboxPecho() {

  const hombroI =
    obtenerPunto(5);


  const hombroD =
    obtenerPunto(6);


  const caderaI =
    obtenerPunto(11);


  const caderaD =
    obtenerPunto(12);


  if (
    !hombroI ||
    !hombroD ||
    !caderaI ||
    !caderaD
  ) {

    return null;

  }


  return {

    tipo:
      "pecho",

    x:
      (
        hombroI.x +
        hombroD.x +
        caderaI.x +
        caderaD.x
      ) / 4,

    y:
      (
        hombroI.y +
        hombroD.y +
        caderaI.y +
        caderaD.y
      ) / 4,

    radio:
      0.090 *
      escalaCuerpo

  };

}


/* =====================================================
   TODAS LAS HITBOXES
===================================================== */

function obtenerHitboxes() {

  const resultado = [];


  const rI =
    hitboxRodilla(
      obtenerPunto(13),
      "rodilla izquierda"
    );


  const rD =
    hitboxRodilla(
      obtenerPunto(14),
      "rodilla derecha"
    );


  const pI =
    hitboxPie(
      obtenerPunto(15),
      "pie izquierdo"
    );


  const pD =
    hitboxPie(
      obtenerPunto(16),
      "pie derecho"
    );


  const pecho =
    hitboxPecho();


  if (pI)
    resultado.push(pI);


  if (pD)
    resultado.push(pD);


  if (rI)
    resultado.push(rI);


  if (rD)
    resultado.push(rD);


  if (pecho)
    resultado.push(pecho);


  return resultado;

}


/* =====================================================
   DISTANCIA
===================================================== */

function distancia(
  a,
  b
) {

  const dx =
    a.x - b.x;


  const dy =
    a.y - b.y;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =====================================================
   PUNTO MÁS CERCANO
===================================================== */

function puntoMasCercano(
  hitbox
) {

  return {

    x:
      hitbox.x,

    y:
      hitbox.y

  };

}


/* =====================================================
   VELOCIDAD DEL CUERPO
===================================================== */

function velocidadPunto(
  punto
) {

  if (!punto)
    return {
      x: 0,
      y: 0
    };


  let mejor =
    null;


  let mejorDistancia =
    Infinity;


  for (
    const clave
    in historial
  ) {

    const h =
      historial[clave];


    const d =
      Math.abs(
        h.x -
        punto.x
      )
      +
      Math.abs(
        h.y -
        punto.y
      );


    if (
      d <
      mejorDistancia
    ) {

      mejorDistancia =
        d;

      mejor =
        h;

    }

  }


  if (!mejor) {

    return {
      x: 0,
      y: 0
    };

  }


  return {

    x:
      mejor.vx,

    y:
      mejor.vy

  };

}


/* =====================================================
   INTERSECCIÓN DE TRAYECTORIA
===================================================== */

function comprobarTrayectoria(
  anterior,
  actual,
  objetivo,
  radio
) {

  /*
     Vector del movimiento del balón.
  */

  const dx =
    actual.x -
    anterior.x;


  const dy =
    actual.y -
    anterior.y;


  const longitud2 =
    dx * dx +
    dy * dy;


  /*
     Si casi no se mueve,
     comprobamos posición normal.
  */

  if (
    longitud2 < 0.0000001
  ) {

    return
      distancia(
        actual,
        objetivo
      )
      <= radio;

  }


  /*
     Proyección del objetivo
     sobre la trayectoria.
  */

  let t =
    (
      (
        objetivo.x -
        anterior.x
      ) * dx
      +
      (
        objetivo.y -
        anterior.y
      ) * dy
    )
    /
    longitud2;


  t =
    Math.max(
      0,
      Math.min(
        1,
        t
      )
    );


  const cercano = {

    x:
      anterior.x +
      t * dx,

    y:
      anterior.y +
      t * dy

  };


  return
    distancia(
      cercano,
      objetivo
    )
    <= radio;

}


/* =====================================================
   CONTACTO
===================================================== */

function comprobarContacto() {

  if (
    !jugando ||
    !pelota.activa
  ) {

    return;

  }


  const ahora =
    performance.now();


  /*
     BLOQUEO DE 700 MS.
  */

  if (
    ahora -
    pelota.ultimoToque
    <
    TIEMPO_BLOQUEO
  ) {

    return;

  }


  const hitboxes =
    obtenerHitboxes();


  /*
     Primero comprobamos
     pies y rodillas.

     El pecho queda después.
  */

  const ordenados =
    hitboxes.sort(
      (a, b) => {

        const da =
          distancia(
            pelota,
            a
          );


        const db =
          distancia(
            pelota,
            b
          );


        return da - db;

      }
    );


  for (
    const hitbox
    of ordenados
  ) {

    const objetivo =
      puntoMasCercano(
        hitbox
      );


    /*
       Radio total:

       hitbox del cuerpo
       +
       balón.

       No es enorme.
    */

    const radioTotal =
      hitbox.radio +
      pelota.radio;


    /*
       Primero trayectoria.

       Esto evita que el balón
       atraviese el cuerpo entre
       dos frames.
    */

    const toca =
      comprobarTrayectoria(

        {
          x:
            pelota.anteriorX,

          y:
            pelota.anteriorY

        },

        {

          x:
            pelota.x,

          y:
            pelota.y

        },

        objetivo,

        radioTotal

      );


    if (toca) {

      realizarToque(
        hitbox,
        objetivo
      );

      return;

    }

  }

}


/* =====================================================
   REALIZAR TOQUE
===================================================== */

function realizarToque(
  hitbox,
  punto
) {

  const ahora =
    performance.now();


  /*
     Seguridad.

     700 ms completos.
  */

  if (
    ahora -
    pelota.ultimoToque
    <
    TIEMPO_BLOQUEO
  ) {

    return;

  }


  pelota.ultimoToque =
    ahora;


  pelota.ultimoTipo =
    hitbox.tipo;


  /*
     SUMAR.
  */

  contador++;


  contadorTexto.textContent =
    contador;


  /*
     Movimiento de la parte
     del cuerpo.
  */

  const velocidad =
    velocidadPunto(
      punto
    );


  /*
     IMPULSO BASE.

     Bastante alto, pero
     limitado.
  */

  let impulso =
    IMPULSO_BASE;


  /*
     Si la parte se mueve
     hacia arriba, aumentamos
     un poco el impulso.
  */

  if (
    velocidad.y < 0
  ) {

    impulso +=
      Math.abs(
        velocidad.y
      ) *
      0.35;

  }


  /*
     Limitar.
  */

  impulso =
    Math.max(
      IMPULSO_BASE,
      Math.min(
        IMPULSO_MAX,
        impulso
      )
    );


  /*
     PIE.

     Un toque de pie tiene
     bastante fuerza.
  */

  if (
    hitbox.tipo.includes(
      "pie"
    )
  ) {

    impulso *=
      1.04;

  }


  /*
     RODILLA.
  */

  if (
    hitbox.tipo.includes(
      "rodilla"
    )
  ) {

    impulso *=
      0.96;

  }


  /*
     PECHO.

     Más amortiguado.
  */

  if (
    hitbox.tipo ===
    "pecho"
  ) {

    impulso *=
      0.72;

  }


  /*
     VELOCIDAD LATERAL.

     Menos agresiva que antes.
  */

  let horizontal =
    velocidad.x *
    0.35;


  horizontal =
    Math.max(
      -0.006,
      Math.min(
        0.006,
        horizontal
      )
    );


  /*
     Aplicar.
  */

  pelota.vy =
    -impulso;


  pelota.vx =
    horizontal;


  /*
     Colocar la pelota
     justo encima del punto.
  */

  pelota.x =
    Math.max(
      0.04,
      Math.min(
        0.96,
        punto.x
      )
    );


  pelota.y =
    Math.max(
      0.04,
      punto.y -
      0.025
    );

}


/* =====================================================
   ACTUALIZAR FÍSICA
===================================================== */

let ultimoFrame =
  performance.now();


function actualizarPelota(
  tiempo
) {

  if (
    !pelota.activa
  ) {

    ultimoFrame =
      tiempo;

    return;

  }


  let delta =
    tiempo -
    ultimoFrame;


  ultimoFrame =
    tiempo;


  /*
     Evita saltos cuando
     el móvil pierde frames.
  */

  delta =
    Math.min(
      delta,
      35
    );


  const factor =
    delta /
    16.67;


  /*
     Guardar posición anterior.
  */

  pelota.anteriorX =
    pelota.x;


  pelota.anteriorY =
    pelota.y;


  /*
     GRAVEDAD.
  */

  pelota.vy +=
    GRAVEDAD *
    factor;


  /*
     MOVIMIENTO.
  */

  pelota.x +=
    pelota.vx *
    factor;


  pelota.y +=
    pelota.vy *
    factor;


  /*
     AIRE.
  */

  pelota.vx *=
    Math.pow(
      0.997,
      factor
    );


  /*
     PAREDES.

     Rebote moderado.
  */

  if (
    pelota.x <
    0.035
  ) {

    pelota.x =
      0.035;


    pelota.vx =
      Math.abs(
        pelota.vx
      )
      *
      REBOTE_PARED;

  }


  if (
    pelota.x >
    0.965
  ) {

    pelota.x =
      0.965;


    pelota.vx =
      -Math.abs(
        pelota.vx
      )
      *
      REBOTE_PARED;

  }


  /*
     Si cae demasiado,
     lo devolvemos arriba.
  */

  if (
    pelota.y >
    1.06
  ) {

    pelota.x =
      0.45 +
      Math.random() *
      0.10;


    pelota.y =
      0.10;


    pelota.vx =
      0;


    pelota.vy =
      0.002;

  }


  /*
     CONTACTO.
  */

  comprobarContacto();


  /*
     DIBUJAR.
  */

  const ancho =
    zonaCamara.clientWidth;


  const alto =
    zonaCamara.clientHeight;


  balon.style.left =
    (
      pelota.x *
      ancho
    )
    + "px";


  balon.style.top =
    (
      pelota.y *
      alto
    )
    + "px";

}


/* =====================================================
   BUCLE
===================================================== */

function bucleFisica(
  tiempo
) {

  actualizarPelota(
    tiempo
  );


  requestAnimationFrame(
    bucleFisica
  );

}


requestAnimationFrame(
  bucleFisica
);


/* =====================================================
   EMPEZAR
===================================================== */

empezar.onclick =
  () => {

    contador =
      0;


    contadorTexto.textContent =
      "0";


    jugando =
      true;


    /*
       GENERAR BALÓN.
    */

    pelota.activa =
      true;


    pelota.x =
      0.50;


    pelota.y =
      0.12;


    pelota.anteriorX =
      pelota.x;


    pelota.anteriorY =
      pelota.y;


    pelota.vx =
      0;


    pelota.vy =
      0.002;


    pelota.ultimoToque =
      -10000;


    pelota.ultimoTipo =
      "";


    balon.style.display =
      "block";


    estado.textContent =
      "🔥 ¡Haz toques!";


    empezar.disabled =
      true;

  };


/* =====================================================
   REINICIAR
===================================================== */

reiniciar.onclick =
  () => {

    jugando =
      false;


    contador =
      0;


    contadorTexto.textContent =
      "0";


    pelota.activa =
      false;


    pelota.vx =
      0;


    pelota.vy =
      0;


    pelota.ultimoToque =
      -10000;


    pelota.ultimoTipo =
      "";


    balon.style.display =
      "none";


    empezar.disabled =
      !video.srcObject;


    estado.textContent =
      video.srcObject
        ? "Pulsa «Empezar»"
        : "Activa la cámara";

  };


/* =====================================================
   CALIBRAR
===================================================== */

calibrar.onclick =
  () => {

    recalibrar();

  };
